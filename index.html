<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ДЗ · 6-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f5f7fc;
            color: #1a1a2e;
            transition: 0.2s;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        body.dark {
            background: #12121a;
            color: #eaeef5;
        }
        body.dark .card {
            background: #1e1e2e;
            border-color: #2e2e44;
        }
        body.dark .filter-bar {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .filter-bar select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .modal-content {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .modal-content input,
        body.dark .modal-content textarea,
        body.dark .modal-content select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .task-date {
            background: #2a2a40;
            color: #b0b8d0;
        }
        body.dark .task-date.overdue {
            background: #3a1a1a;
            color: #ff9a9a;
        }
        body.dark .task-subject {
            background: #2a2a44;
            color: #8ab4ff;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .container {
            max-width: 820px;
            width: 100%;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #dce0e8;
        }
        body.dark .app-header {
            border-bottom-color: #2a2a40;
        }
        .app-header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .app-header h1 i {
            color: #1a73e8;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #c0c8d8;
            background: transparent;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            color: #1a1a2e;
            text-decoration: none;
        }
        body.dark .btn {
            color: #eaeef5;
            border-color: #3a4a6a;
        }
        .btn-primary {
            background: #1a73e8;
            border-color: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-outline {
            background: transparent;
        }
        .btn-outline:hover {
            background: #e8edf5;
        }
        body.dark .btn-outline:hover {
            background: #2a2a40;
        }
        .btn-danger {
            color: #d43f3f;
            border-color: #d43f3f;
        }
        .btn-danger:hover {
            background: #fce8e8;
        }
        body.dark .btn-danger {
            color: #ff7a7a;
            border-color: #6a2a2a;
        }
        body.dark .btn-danger:hover {
            background: #2a1a1a;
        }
        .btn-sm {
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: inherit;
        }
        .admin-btn {
            border-color: #f0b400;
            color: #b8860b;
        }
        body.dark .admin-btn {
            border-color: #f0b400;
            color: #f0b400;
        }
        .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
            border-color: #f0b400;
        }
        body.dark .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
        }
        .stat-item {
            background: #eef2f8;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #2a2a4a;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            background: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #dce0e8;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        .filter-bar label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a3a5a;
        }
        body.dark .filter-bar label {
            color: #b0b8d0;
        }
        .filter-bar select {
            border: 1px solid #d0d8e8;
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
        }
        .filter-bar .filter-reset {
            margin-left: auto;
            font-size: 0.75rem;
            color: #6a7a9a;
            cursor: pointer;
            border-bottom: 1px dashed #b0b8d0;
        }
        .filter-bar .filter-reset:hover {
            color: #1a73e8;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #e0e6f0;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .card:hover {
            border-color: #b0c8f0;
            transform: translateY(-2px);
        }
        .card.pinned {
            border-color: #f0b400;
            background: #fffbe6;
        }
        body.dark .card.pinned {
            border-color: #f0b400;
            background: #1a1a0a;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .task-subject {
            font-weight: 600;
            background: #eef4ff;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            color: #1a5bb0;
            font-size: 0.85rem;
        }
        body.dark .task-subject {
            background: #1a2a4a;
            color: #8ab4ff;
        }
        .task-date {
            font-size: 0.75rem;
            background: #eef2f8;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            color: #3a4a6a;
        }
        .task-date.overdue {
            background: #ffebeb;
            color: #b52a2a;
        }
        .task-text {
            margin: 0.6rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .task-attachment {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.3rem 0 0.6rem;
            font-size: 0.8rem;
            background: #f4f8ff;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            border: 1px solid #d0dcf0;
            width: fit-content;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        .task-attachment img {
            max-height: 120px;
            border-radius: 12px;
            border: 1px solid #d0d8e8;
        }
        .task-attachment a {
            color: #1a73e8;
            text-decoration: none;
            border-bottom: 1px dashed #a0b8e0;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid #e8ecf4;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        .author-block {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 40px;
            background: #dce4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: #1a2a4a;
            text-transform: uppercase;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        .author-name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .author-time {
            font-size: 0.7rem;
            color: #6a7a9a;
        }
        body.dark .author-time {
            color: #8a8aa0;
        }
        .task-actions {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #8a9ab8;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        .like-btn.liked {
            color: #e84a5f;
        }
        .like-btn .like-count {
            font-size: 0.75rem;
            font-weight: 500;
            color: #5a6a8a;
        }
        body.dark .like-btn .like-count {
            color: #8a8aa0;
        }
        .like-btn:hover {
            transform: scale(1.1);
        }
        .pin-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #b0b8d0;
            transition: 0.15s;
        }
        .pin-btn.active {
            color: #f0b400;
        }
        .pin-btn:hover {
            transform: scale(1.1);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #fff;
            border-radius: 32px;
            max-width: 520px;
            width: 90%;
            padding: 2rem 1.8rem;
            border: 1px solid #e0e6f0;
            transform: scale(0.95);
            transition: 0.2s;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-content h2 {
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: #3a4a6a;
        }
        body.dark .form-group label {
            color: #b0b8d0;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #d0d8e8;
            border-radius: 60px;
            font-size: 0.9rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
            transition: 0.1s;
        }
        .form-group textarea {
            border-radius: 20px;
            min-height: 70px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1a73e8;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1 1 140px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6a7a9a;
        }
        .empty-state i {
            font-size: 3rem;
            color: #c0c8d8;
            margin-bottom: 0.5rem;
        }
        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #8a9ab8;
            border-top: 1px solid #e0e6f0;
            padding-top: 1rem;
        }
        body.dark .footer {
            border-top-color: #2a2a40;
            color: #6a7a9a;
        }
        .admin-panel {
            background: #fff;
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid #f0b400;
            margin-bottom: 1.5rem;
            display: none;
        }
        .admin-panel.visible {
            display: block;
        }
        body.dark .admin-panel {
            background: #1a1a2a;
            border-color: #f0b400;
        }
        .admin-panel h3 {
            margin-bottom: 1rem;
            color: #f0b400;
        }
        .admin-panel .form-group {
            margin-bottom: 0.8rem;
        }
        .admin-panel .btn {
            margin-right: 0.5rem;
            margin-bottom: 0.3rem;
        }
        .admin-panel .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .admin-panel .stat-table th,
        .admin-panel .stat-table td {
            padding: 0.3rem 0.6rem;
            border: 1px solid #dce0e8;
            text-align: left;
        }
        body.dark .admin-panel .stat-table th,
        body.dark .admin-panel .stat-table td {
            border-color: #2a2a40;
        }
        .admin-panel .stat-table th {
            background: #eef2f8;
        }
        body.dark .admin-panel .stat-table th {
            background: #1a1a2a;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a73e8;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 2000;
            font-weight: 500;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        body.dark .notification {
            background: #1a2a4a;
            color: #eaeef5;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .notification.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
        }
        .loading-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6a7a9a;
        }
        .loading-state i {
            font-size: 2rem;
            margin-right: 0.5rem;
        }
        .log-entry {
            padding: 0.2rem 0.5rem;
            border-bottom: 1px solid #2a2a40;
            font-size: 0.8rem;
            font-family: monospace;
            color: #b0b8d0;
        }
        .log-entry .log-time {
            color: #6a7a9a;
        }
        .log-entry .log-user {
            color: #f0b400;
        }
        .log-entry .log-action {
            color: #8ab4ff;
        }
        .banned-item {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0.5rem;
            border-bottom: 1px solid #2a2a40;
            font-size: 0.85rem;
            align-items: center;
        }
        .banned-item .banned-name {
            color: #ea4335;
            font-weight: 500;
        }
        .banned-item .unban-btn {
            padding: 0.1rem 0.6rem;
            font-size: 0.7rem;
            border-radius: 30px;
            border: 1px solid #ea4335;
            background: transparent;
            color: #ea4335;
            cursor: pointer;
            transition: 0.15s;
        }
        .banned-item .unban-btn:hover {
            background: #ea4335;
            color: #fff;
        }
        @media (max-width: 600px) {
            body { padding: 0.8rem; }
            .app-header h1 { font-size: 1.4rem; }
            .filter-bar { border-radius: 20px; padding: 0.6rem; }
            .filter-bar label { width: 100%; }
            .filter-bar .filter-reset { margin-left: 0; }
            .card { padding: 1rem; }
            .modal-content { padding: 1.5rem; }
            .task-footer { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .task-actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1><i class="fas fa-home"></i> 6-1 · ДЗ</h1>
            <div class="header-actions">
                <span class="stat-item" id="taskCount">0</span>
                <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Добавить</button>
                <button class="btn btn-outline btn-sm admin-btn" id="adminBtn"><i class="fas fa-lock"></i> <span id="adminLabel">Админ</span></button>
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="admin-panel" id="adminPanel">
            <h3>🛠 Админ-панель</h3>
            
            <div class="form-group" id="logGroup" style="display:none;">
                <label>📋 Лог действий</label>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;">
                    <button class="btn btn-outline btn-sm" id="refreshLogsBtn"><i class="fas fa-sync-alt"></i> Обновить</button>
                    <button class="btn btn-danger btn-sm" id="clearLogsBtn"><i class="fas fa-trash"></i> Очистить</button>
                    <button class="btn btn-success btn-sm" id="exportLogsBtn"><i class="fas fa-download"></i> Экспорт</button>
                </div>
                <div id="logContainer" style="max-height:300px;overflow-y:auto;border:1px solid #2a2a40;border-radius:12px;background:#0d0d1a;padding:0.3rem 0;"></div>
                <div style="margin-top:0.3rem;font-size:0.7rem;color:#6a7a9a;">Всего записей: <span id="logTotalCount">0</span></div>
            </div>

            <div class="form-group" id="bannedListGroup" style="display:none;">
                <label>🚫 Забаненные пользователи</label>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem;">
                    <button class="btn btn-outline btn-sm" id="refreshBannedBtn"><i class="fas fa-sync-alt"></i> Обновить</button>
                </div>
                <div id="bannedListContainer" style="max-height:200px;overflow-y:auto;border:1px solid #2a2a40;border-radius:12px;background:#0d0d1a;padding:0.3rem 0;">
                    <div style="padding:0.5rem;color:#6a7a9a;text-align:center;">Загрузка...</div>
                </div>
                <div style="margin-top:0.3rem;font-size:0.7rem;color:#6a7a9a;">Всего: <span id="bannedTotalCount">0</span></div>
            </div>

            <div class="form-group">
                <label>Уведомление для всех</label>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="adminNotifyInput" placeholder="Текст уведомления" style="flex:1;">
                    <button class="btn btn-primary" id="adminNotifyBtn"><i class="fas fa-bell"></i> Отправить</button>
                </div>
            </div>
            <div class="form-group">
                <label>Бан пользователя</label>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="adminBanInput" placeholder="Имя пользователя" style="flex:1;">
                    <button class="btn btn-danger" id="adminBanBtn"><i class="fas fa-ban"></i> Забанить</button>
                    <button class="btn btn-outline" id="adminUnbanBtn"><i class="fas fa-undo"></i> Разбанить</button>
                </div>
            </div>
            <div class="form-group" id="adminManageGroup" style="display:none;">
                <label>Управление админами (только суперадмин)</label>
                <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                    <input type="text" id="adminAddInput" placeholder="Имя нового админа" style="flex:1;">
                    <button class="btn btn-primary" id="adminAddBtn"><i class="fas fa-user-plus"></i> Назначить</button>
                    <button class="btn btn-danger" id="adminRemoveBtn"><i class="fas fa-user-minus"></i> Удалить</button>
                </div>
                <div id="adminList" style="margin-top:0.5rem;font-size:0.85rem;color:#6a7a9a;"></div>
            </div>
            <div class="form-group">
                <button class="btn btn-danger" id="adminClearOldBtn"><i class="fas fa-trash"></i> Удалить все просроченные</button>
                <button class="btn btn-outline" id="adminRefreshStatsBtn"><i class="fas fa-chart-bar"></i> Обновить статистику</button>
            </div>
            <div id="adminStats" style="margin-top:0.5rem;font-size:0.85rem;"></div>

        // ---------- СОХРАНЕНИЕ (С ЗАЩИТОЙ ОТ СПАМА 15 СЕКУНД) ----------
        function saveTask() {
            const subject = document.getElementById('formSubject').value.trim();
            const text = document.getElementById('formText').value.trim();
            const date = document.getElementById('formDate').value;
            const author = document.getElementById('formAuthor').value.trim() || currentUser;
            const attachment = document.getElementById('formAttachment').value.trim();

            if (!subject) { alert('Введите предмет!'); return; }
            if (!text) { alert('Введите описание задания!'); return; }
            if (!date) { alert('Выберите дату!'); return; }

            if (bannedUsers.indexOf(author) !== -1) {
                alert('❌ Вы забанены и не можете добавлять задания!');
                return;
            }

            if (isSending) {
                alert('⏳ Подождите 15 секунд перед отправкой следующего задания');
                return;
            }

            saveStatusEl.textContent = '⏳ Сохранение...';
            saveStatusEl.style.color = '#1a73e8';

            const taskData = {
                subject: subject,
                text: text,
                date: date,
                author: author,
                attachment: attachment,
                done: false,
                likes: [],
                pinned: false,
                timestamp: Date.now()
            };

            let promise;
            let isNew = false;
            if (editingId) {
                const old = tasks.find(function(t) { return t.id === editingId; });
                if (old) {
                    taskData.likes = old.likes || [];
                    taskData.timestamp = old.timestamp || Date.now();
                    taskData.pinned = old.pinned || false;
                }
                promise = tasksRef.child(editingId).update(taskData);
                addLog('Редактирование задания', 'ID: ' + editingId + ', предмет: ' + subject);
            } else {
                isNew = true;
                promise = tasksRef.push().set(taskData);
                addLog('Добавление задания', 'Предмет: ' + subject + ', автор: ' + author);
            }

            promise.then(function() {
                saveStatusEl.textContent = '✅ Сохранено!';
                saveStatusEl.style.color = '#34a853';
                const saveBtn = document.getElementById('saveBtn');
                if (!isNew) {
                    setTimeout(function() { closeModal(); }, 1000);
                } else {
                    saveStatusEl.textContent = '✅ Отправлено!';
                    document.getElementById('sendStatus').textContent = '⏳ Подождите 15с перед следующим';
                    saveBtn.disabled = true;
                    saveBtn.style.opacity = '0.6';
                    saveBtn.style.cursor = 'not-allowed';
                    isSending = true;
                    let seconds = 15;
                    if (sendTimer) clearInterval(sendTimer);
                    sendTimer = setInterval(function() {
                        seconds--;
                        if (seconds <= 0) {
                            clearInterval(sendTimer);
                            sendTimer = null;
                            saveBtn.disabled = false;
                            saveBtn.style.opacity = '1';
                            saveBtn.style.cursor = 'pointer';
                            document.getElementById('sendStatus').textContent = '';
                            isSending = false;
                        } else {
                            document.getElementById('sendStatus').textContent = '⏳ Подождите ' + seconds + 'с';
                        }
                    }, 1000);
                    setTimeout(function() { closeModal(); }, 1000);
                }
                if (isNew) {
                    const msg = '📚 <b>Новое задание в 6-1!</b>\n' +
                        'Предмет: ' + subject + '\n' +
                        'Задание: ' + text + '\n' +
                        'Автор: ' + author + '\n' +
                        'Дата: ' + date.split('-').reverse().join('.');
                    sendToTelegram(msg).catch(function(e) { console.warn('Telegram error:', e); });
                }
            }).catch(function(err) {
                saveStatusEl.textContent = '❌ Ошибка: ' + err.message;
                saveStatusEl.style.color = '#ea4335';
                console.error('❌ Save error:', err);
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
                saveBtn.style.cursor = 'pointer';
                document.getElementById('sendStatus').textContent = '';
                isSending = false;
                if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
            });
        }

        // ---------- РЕНДЕРИНГ ----------
        function render() {
            if (isLoading) {
                taskListEl.innerHTML = '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Загрузка заданий...</div>';
                return;
            }

            const day = dayFilter.value;
            const subject = subjectFilter.value;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const weekEnd = new Date(today);
            weekEnd.setDate(weekEnd.getDate() + 7);

            let filtered = tasks.filter(function(task) {
                if (subject !== 'all' && task.subject !== subject) return false;
                if (day !== 'all') {
                    const taskDate = new Date(task.date + 'T00:00:00');
                    if (day === 'today' && (taskDate < today || taskDate >= tomorrow)) return false;
                    if (day === 'tomorrow' && (taskDate < tomorrow || taskDate >= new Date(tomorrow.getTime() + 86400000))) return false;
                    if (day === 'week' && (taskDate < today || taskDate >= weekEnd)) return false;
                }
                return true;
            });

            filtered.sort(function(a, b) {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                const da = new Date(a.date + 'T00:00:00');
                const db = new Date(b.date + 'T00:00:00');
                return da - db;
            });

            taskCountEl.textContent = tasks.length;
            footerCountEl.textContent = tasks.length;

            const list = taskListEl;
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Заданий пока нет</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(function(task) {
                const taskDate = new Date(task.date + 'T00:00:00');
                const now = new Date(); now.setHours(0,0,0,0);
                const isOverdue = !task.done && taskDate < now;
                const dateStr = task.date.split('-').reverse().join('.');
                const dayOfWeek = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][taskDate.getDay()];

                const author = task.author || 'Аноним';
                const initials = author.split(' ').map(function(s) { return s[0]; }).join('').toUpperCase().slice(0,2);

                let attachHtml = '';

                    e.stopPropagation();

        // ---------- ЛАЙК ----------
        function toggleLike(taskId) {
            if (bannedUsers.indexOf(currentUser) !== -1) {
                showNotification('❌ Вы забанены и не можете ставить лайки!', 3000);
                return;
            }
            const task = tasks.find(function(t) { return t.id === taskId; });
            if (!task) return;

            const idx = likes.indexOf(currentUser);
            let action = 'Добавление лайка';

                action = 'Лайк +1';

            addLog(action, 'Задание: ' + task.subject + ', автор: ' + task.author);
        }

        function togglePin(taskId) {

                stats[author].likes += likes.length;

            let count = 0;
            tasks.forEach(function(task) {
                const taskDate = new Date(task.date + 'T00:00:00');

        // ---------- ОБРАБОТЧИКИ ЛОГОВ ----------

                loadLogs();
                showNotification('Логи обновлены', 2000);

        if (clearLogsBtn) {
            clearLogsBtn.addEventListener('click', function() {
                if (!isSuperAdmin) return;
                if (!confirm('Удалить все логи?')) return;
                logsRef.remove().then(function() {
                    showNotification('Логи очищены', 2000);
                    loadLogs();
                }).catch(function(e) {
                    alert('Ошибка очистки логов: ' + e.message);

        if (exportLogsBtn) {
            exportLogsBtn.addEventListener('click', function() {
                if (!isSuperAdmin) return;
                if (!allLogs || allLogs.length === 0) {

                let text = '=== ЛОГ ДЕЙСТВИЙ ===\n';
                allLogs.forEach(function(log) {
                    const time = new Date(log.timestamp).toLocaleString('ru', {
                        day: '2-digit', month: '2-digit', year: 'numeric',

                    });
                    text += '[' + time + '] ' + (log.user || 'Система') + ' — ' + log.action;
                    if (log.details) text += ' (' + log.details + ')';
                    text += '\n';
                });
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'logs_export.txt';
                a.click();
                showNotification('Логи экспортированы', 2000);
            });

        // ---------- ОБРАБОТЧИК СПИСКА БАНОВ ----------
        if (refreshBannedBtn) {
            refreshBannedBtn.addEventListener('click', function() {
                loadBannedList();
                showNotification('Список банов обновлён', 2000);

        // ---------- МОДАЛКА ----------
        function openModal(title, data) {

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = false;
            saveBtn.style.opacity = '1';
            saveBtn.style.cursor = 'pointer';
            if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }

        // ---------- ОБРАБОТЧИКИ ----------

        document.querySelectorAll('#taskForm input, #taskForm textarea').forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && this.tagName !== 'TEXTAREA') {

        // ---------- ФИЛЬТРЫ ----------

        resetFiltersBtn.addEventListener('click', function() {
            dayFilter.value = 'all';
            subjectFilter.value = 'all';

        // ---------- СТАРТ ----------
        console.log('🚀 Сайт загружен с логами, списком банов и защитой от спама');

        if (isAdmin) showStats();
        if (isSuperAdmin) {

<script>
    (function() {
        'use strict';

        // ---------- РАСШИРЕННАЯ СИСТЕМА РОЛЕЙ ----------
        const ROLES = {
            USER: 'user',
            MODERATOR: 'moderator',
            ADMIN: 'admin',
            SUPERADMIN: 'superadmin'
        };

        const ROLE_LEVELS = {
            user: 1,
            moderator: 2,
            admin: 3,
            superadmin: 4
        };

        function hasRole(requiredRole) {
            if (!currentUser) return false;
            if (!currentUser.role) return requiredRole === 'user';
            return ROLE_LEVELS[currentUser.role] >= ROLE_LEVELS[requiredRole];
        }

        function isAtLeast(required) {
            return hasRole(required);
        }

        // ---------- ПЕРЕОПРЕДЕЛЕНИЕ ПРОВЕРКИ ПРАВ ----------
        // Сохраняем старые функции, если они были
        const originalCheckAdminRights = window.checkAdminRights || function(){};
        const originalUpdateAdminUI = window.updateAdminUI || function(){};

        // Переопределяем checkAdminRights
        window.checkAdminRights = function() {
            if (!currentUser) {
                isAdmin = false;
                isSuperAdmin = false;
                updateAdminUI();
                return;
            }
            const role = currentUser.role || 'user';
            if (role === 'superadmin') {
                isSuperAdmin = true;
                isAdmin = true;
            } else if (role === 'admin') {
                isSuperAdmin = false;
                isAdmin = true;
            } else if (role === 'moderator') {
                isSuperAdmin = false;
                isAdmin = true; // Модератор тоже имеет доступ к админ-панели, но с ограничениями
            } else {
                isSuperAdmin = false;
                isAdmin = false;
            }
            updateAdminUI();
        };

        // Переопределяем updateAdminUI
        window.updateAdminUI = function() {
            const role = currentUser ? currentUser.role : 'user';
            
            // Показываем/скрываем админ-панель
            if (isAdmin || role === 'moderator' || role === 'admin' || role === 'superadmin') {
                adminPanel.classList.add('visible');
            } else {
                adminPanel.classList.remove('visible');
            }

            // Управление админами — только суперадмин
            if (role === 'superadmin') {
                adminManageGroup.style.display = 'block';
                adminBtn.classList.add('active');
                adminLabel.textContent = 'Суперадмин';
            } else if (role === 'admin') {
                adminManageGroup.style.display = 'none';
                adminBtn.classList.add('active');
                adminLabel.textContent = 'Админ';
            } else if (role === 'moderator') {
                adminManageGroup.style.display = 'none';
                adminBtn.classList.add('active');
                adminLabel.textContent = 'Модератор';
            } else {
                adminManageGroup.style.display = 'none';
                adminBtn.classList.remove('active');
                adminLabel.textContent = 'Админ';
            }

            if (role === 'superadmin' || role === 'admin') {
                logGroup.style.display = 'block';
            } else {
                logGroup.style.display = 'none';
            }

            // Список банов — только суперадмин и админ
            if (role === 'superadmin' || role === 'admin') {
                bannedListGroup.style.display = 'block';
            } else {
                bannedListGroup.style.display = 'none';
            }

            // Кнопка "Удалить все просроченные" — модератор, админ, суперадмин
            if (role === 'moderator' || role === 'admin' || role === 'superadmin') {
                adminClearOldBtn.style.display = 'inline-flex';
            } else {
                adminClearOldBtn.style.display = 'none';

            // Бан/разбан — только админ и суперадмин
            if (role === 'admin' || role === 'superadmin') {
                adminBanBtn.style.display = 'inline-flex';

            if (adminList) {

            }
        };

        // ---------- ДОБАВЛЯЕМ УПРАВЛЕНИЕ МОДЕРАТОРАМИ ----------
        // Создаём новый блок в админ-панели для управления ролями (только суперадмин)

            <div class="form-group" id="roleManageGroup" style="display:none;">

                        <option value="user">Пользователь</option>

                        <option value="admin">Админ</option>
                        <option value="superadmin">Суперадмин</option>
                    </select>
                    <button class="btn btn-primary btn-sm" id="roleAssignBtn"><i class="fas fa-user-cog"></i> Назначить</button>
                </div>
                <div id="userRoleList" style="margin-top:0.5rem;font-size:0.85rem;color:#6a7a9a;"></div>
            </div>
        `;

        // Вставляем блок после adminManageGroup
        const adminPanel = document.getElementById('adminPanel');
        const manageGroup = document.getElementById('adminManageGroup');
        if (adminPanel && manageGroup) {
            const temp = document.createElement('div');
            temp.innerHTML = roleManageHtml;
            const newBlock = temp.firstElementChild;
            manageGroup.parentNode.insertBefore(newBlock, manageGroup.nextSibling);
        }

        // Получаем элементы
        const roleManageGroup = document.getElementById('roleManageGroup');
        const roleUserInput = document.getElementById('roleUserInput');
        const roleSelect = document.getElementById('roleSelect');
        const roleAssignBtn = document.getElementById('roleAssignBtn');
        const userRoleList = document.getElementById('userRoleList');

        // ---------- ЗАГРУЗКА СПИСКА ВСЕХ ПОЛЬЗОВАТЕЛЕЙ ДЛЯ УПРАВЛЕНИЯ РОЛЯМИ ----------
        function loadUserRoles() {
            if (!isSuperAdmin) return;
            usersRef.once('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    userRoleList.innerHTML = 'Пользователей нет';
                    return;
                }
                let html = '<strong>Все пользователи:</strong><br>';
                Object.entries(data).forEach(function(entry) {
                    const username = entry[0];
                    const userData = entry[1];
                    const role = userData.role || 'user';
                    html += username + ' — <span style="color:#f0b400;">' + role + '</span><br>';
                });
                userRoleList.innerHTML = html;
            });
        }

        // ---------- НАЗНАЧЕНИЕ РОЛИ ----------
        roleAssignBtn.addEventListener('click', function() {
            if (!isSuperAdmin) {
                alert('Только суперадмин может назначать роли!');
                return;
            }
            const username = roleUserInput.value.trim();
            const role = roleSelect.value;
            if (!username) {
                alert('Введите имя пользователя!');
                return;
            }
            usersRef.child(username).once('value', function(snap) {
                if (!snap.exists()) {
                    alert('Пользователь не найден!');
                    return;
                }
                usersRef.child(username).update({ role: role }).then(function() {
                    showNotification('✅ ' + username + ' назначена роль: ' + role, 3000);
                    addLog('Назначение роли', username + ' → ' + role);
                    loadUserRoles();
                    // Обновляем права текущего пользователя
                    if (currentUser && currentUser.username === username) {
                        currentUser.role = role;
                        localStorage.setItem('hw6_user', JSON.stringify(currentUser));
                        checkAdminRights();
                    }
                }).catch(function(e) {
                    alert('Ошибка: ' + e.message);
                });
            });
        });

        // ---------- ДОБАВЛЯЕМ ПРОВЕРКУ РОЛЕЙ В СУЩЕСТВУЮЩИЕ ФУНКЦИИ ----------
        // Патчим функцию saveTask
        const originalSaveTask = window.saveTask;
        if (originalSaveTask) {
            window.saveTask = function() {
                if (!currentUser) {
                    alert('Пожалуйста, войдите в систему');
                    return;
                }
                // Проверка на бан
                if (bannedUsers.indexOf(currentUser.username) !== -1) {
                    alert('❌ Вы забанены!');
                    return;
                }
                originalSaveTask();
            };
        }

        // Патчим функцию toggleLike
        const originalToggleLike = window.toggleLike;
        if (originalToggleLike) {
            window.toggleLike = function(taskId) {
                if (!currentUser) {
                    alert('Пожалуйста, войдите в систему');
                    return;
                }
                if (bannedUsers.indexOf(currentUser.username) !== -1) {
                    showNotification('❌ Вы забанены!', 3000);
                    return;
                }
                originalToggleLike(taskId);
            };
        }

        // Патчим функцию openEditModal
        const originalOpenEditModal = window.openEditModal;
        if (originalOpenEditModal) {
            window.openEditModal = function(id) {
                if (!currentUser) {
                    alert('Пожалуйста, войдите в систему');
                    return;
                }
                const task = tasks.find(function(t) { return t.id === id; });
                if (!task) return;
                const role = currentUser.role || 'user';
                // Модератор, админ и суперадмин могут редактировать любые задания
                if (role === 'moderator' || role === 'admin' || role === 'superadmin') {
                    originalOpenEditModal(id);
                    return;
                }
                // Обычный пользователь — только свои
                if (task.author !== currentUser.username) {
                    alert('Вы можете редактировать только свои задания.');
                    return;
                }
                originalOpenEditModal(id);
            };
        }

        // Патчим функцию deleteTask (удаление через кнопку в карточке)
        const originalDeleteTask = window.deleteTask;
        if (originalDeleteTask) {
            window.deleteTask = function(id) {
                if (!currentUser) {
                    alert('Пожалуйста, войдите в систему');
                    return;
                }
                const task = tasks.find(function(t) { return t.id === id; });
                if (!task) return;
                const role = currentUser.role || 'user';
                if (role === 'moderator' || role === 'admin' || role === 'superadmin') {
                    originalDeleteTask(id);
                    return;
                }
                if (task.author !== currentUser.username) {
                    alert('Вы можете удалять только свои задания.');
                    return;
                }
                originalDeleteTask(id);
            };
        }

        // ---------- ПЕРЕОПРЕДЕЛЯЕМ ФУНКЦИЮ АДМИН-ПАНЕЛИ ДЛЯ МОДЕРАТОРА ----------
        // Скрываем ненужные кнопки для модератора
        function updateModeratorUI() {
            const role = currentUser ? currentUser.role : 'user';
            if (role === 'moderator') {
                // Модератор не может банить
                const banGroup = document.querySelector('.form-group:has(#adminBanInput)');
                if (banGroup) {
                    banGroup.style.display = 'none';
                }
                // Модератор не может управлять админами
                if (adminManageGroup) adminManageGroup.style.display = 'none';
                // Модератор не может управлять ролями
                if (roleManageGroup) roleManageGroup.style.display = 'none';
                // Модератор видит логи, но не может их очищать
                if (clearLogsBtn) clearLogsBtn.style.display = 'none';
            }
        }

        // Патчим updateAdminUI
        const originalUpdateAdminUI2 = window.updateAdminUI;
        if (originalUpdateAdminUI2) {
            window.updateAdminUI = function() {
                originalUpdateAdminUI2();
                updateModeratorUI();
            };
        }

        // ---------- ЗАГРУЗКА РОЛЕЙ ПРИ СТАРТЕ ----------
        setTimeout(function() {
            if (isSuperAdmin) {
                roleManageGroup.style.display = 'block';
                loadUserRoles();
            }
            // Показываем правильную роль в админ-панели
            updateModeratorUI();
        }, 500);

        console.log('✅ Трёхуровневая система ролей активирована');
    })();
</script>
</body>
</html>
