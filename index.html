<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ДЗ · 6-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f5f7fc;
            color: #1a1a2e;
            transition: 0.2s;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        body.dark {
            background: #12121a;
            color: #eaeef5;
        }
        body.dark .card {
            background: #1e1e2e;
            border-color: #2e2e44;
        }
        body.dark .filter-bar {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .filter-bar select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .modal-content {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .modal-content input,
        body.dark .modal-content textarea,
        body.dark .modal-content select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .task-date {
            background: #2a2a40;
            color: #b0b8d0;
        }
        body.dark .task-date.overdue {
            background: #3a1a1a;
            color: #ff9a9a;
        }
        body.dark .task-subject {
            background: #2a2a44;
            color: #8ab4ff;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .container {
            max-width: 820px;
            width: 100%;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #dce0e8;
        }
        body.dark .app-header {
            border-bottom-color: #2a2a40;
        }
        .app-header h1 {
            font-weight: 600;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .app-header h1 i {
            color: #1a73e8;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            border: 1px solid #c0c8d8;
            background: transparent;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            color: #1a1a2e;
            text-decoration: none;
            white-space: nowrap;
        }
        body.dark .btn {
            color: #eaeef5;
            border-color: #3a4a6a;
        }
        .btn-primary {
            background: #1a73e8;
            border-color: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-outline {
            background: transparent;
        }
        .btn-outline:hover {
            background: #e8edf5;
        }
        body.dark .btn-outline:hover {
            background: #2a2a40;
        }
        .btn-danger {
            color: #d43f3f;
            border-color: #d43f3f;
        }
        .btn-danger:hover {
            background: #fce8e8;
        }
        body.dark .btn-danger {
            color: #ff7a7a;
            border-color: #6a2a2a;
        }
        body.dark .btn-danger:hover {
            background: #2a1a1a;
        }
        .btn-sm {
            padding: 0.2rem 0.7rem;
            font-size: 0.75rem;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: inherit;
            padding: 0.2rem 0.4rem;
        }
        .admin-btn {
            border-color: #f0b400;
            color: #b8860b;
        }
        body.dark .admin-btn {
            border-color: #f0b400;
            color: #f0b400;
        }
        .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
            border-color: #f0b400;
        }
        body.dark .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
        }
        .stat-item {
            background: #eef2f8;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #2a2a4a;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.8rem;
            background: #fff;
            padding: 0.5rem 1rem;
            border-radius: 60px;
            border: 1px solid #dce0e8;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        body.dark .filter-bar {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        .filter-bar label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.75rem;
            font-weight: 500;
            color: #3a3a5a;
        }
        body.dark .filter-bar label {
            color: #b0b8d0;
        }
        .filter-bar select {
            border: 1px solid #d0d8e8;
            border-radius: 40px;
            padding: 0.1rem 0.6rem;
            font-size: 0.75rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
        }
        body.dark .filter-bar select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        .filter-bar .filter-reset {
            margin-left: auto;
            font-size: 0.7rem;
            color: #6a7a9a;
            cursor: pointer;
            border-bottom: 1px dashed #b0b8d0;
        }
        .filter-bar .filter-reset:hover {
            color: #1a73e8;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            border: 1px solid #e0e6f0;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .card:hover {
            border-color: #b0c8f0;
            transform: translateY(-2px);
        }
        .card.pinned {
            border-color: #f0b400;
            background: #fffbe6;
        }
        body.dark .card.pinned {
            border-color: #f0b400;
            background: #1a1a0a;
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .task-subject {
            font-weight: 600;
            background: #eef4ff;
            padding: 0.05rem 0.8rem;
            border-radius: 40px;
            color: #1a5bb0;
            font-size: 0.8rem;
        }
        body.dark .task-subject {
            background: #1a2a4a;
            color: #8ab4ff;
        }
        .task-date {
            font-size: 0.7rem;
            background: #eef2f8;
            padding: 0.05rem 0.7rem;
            border-radius: 30px;
            color: #3a4a6a;
        }
        .task-date.overdue {
            background: #ffebeb;
            color: #b52a2a;
        }
        body.dark .task-date.overdue {
            background: #3a1a1a;
            color: #ff9a9a;
        }
        .task-text {
            margin: 0.4rem 0;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .task-attachment {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0.2rem 0 0.4rem;
            font-size: 0.75rem;
            background: #f4f8ff;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            border: 1px solid #d0dcf0;
            width: fit-content;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        .task-attachment img {
            max-height: 100px;
            border-radius: 10px;
            border: 1px solid #d0d8e8;
        }
        .task-attachment a {
            color: #1a73e8;
            text-decoration: none;
            border-bottom: 1px dashed #a0b8e0;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.4rem;
            padding-top: 0.4rem;
            border-top: 1px solid #e8ecf4;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        .author-block {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 40px;
            background: #dce4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.6rem;
            color: #1a2a4a;
            text-transform: uppercase;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        .author-name {
            font-weight: 500;
            font-size: 0.85rem;
        }
        .author-time {
            font-size: 0.65rem;
            color: #6a7a9a;
        }
        body.dark .author-time {
            color: #8a8aa0;
        }
        .task-actions {
            display: flex;
            gap: 0.2rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            color: #8a9ab8;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.15rem;
        }
        .like-btn.liked {
            color: #e84a5f;
        }
        .like-btn .like-count {
            font-size: 0.7rem;
            font-weight: 500;
            color: #5a6a8a;
        }
        body.dark .like-btn .like-count {
            color: #8a8aa0;
        }
        .like-btn:hover {
            transform: scale(1.1);
        }
        .pin-btn {
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: #b0b8d0;
            transition: 0.15s;
        }
        .pin-btn.active {
            color: #f0b400;
        }
        .pin-btn:hover {
            transform: scale(1.1);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #fff;
            border-radius: 28px;
            max-width: 520px;
            width: 90%;
            padding: 1.5rem;
            border: 1px solid #e0e6f0;
            transform: scale(0.95);
            transition: 0.2s;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        body.dark .modal-content {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        .modal-content h2 {
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .form-group {
            margin-bottom: 0.8rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
            color: #3a4a6a;
        }
        body.dark .form-group label {
            color: #b0b8d0;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.5rem 0.9rem;
            border: 1px solid #d0d8e8;
            border-radius: 60px;
            font-size: 0.85rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
            transition: 0.1s;
        }
        body.dark .form-group input,
        body.dark .form-group textarea,
        body.dark .form-group select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        .form-group textarea {
            border-radius: 16px;
            min-height: 60px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1a73e8;
        }
        .form-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1 1 120px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }
        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #6a7a9a;
        }
        .empty-state i {
            font-size: 2.5rem;
            color: #c0c8d8;
            margin-bottom: 0.4rem;
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.65rem;
            color: #8a9ab8;
            border-top: 1px solid #e0e6f0;
            padding-top: 1rem;
        }
        body.dark .footer {
            border-top-color: #2a2a40;
            color: #6a7a9a;
        }
        .admin-panel {
            background: #fff;
            border-radius: 20px;
            padding: 1rem 1.2rem;
            border: 1px solid #f0b400;
            margin-bottom: 1.5rem;
            display: none;
        }
        .admin-panel.visible {
            display: block;
        }
        body.dark .admin-panel {
            background: #1a1a2a;
            border-color: #f0b400;
        }
        .admin-panel h3 {
            margin-bottom: 0.8rem;
            color: #f0b400;
            font-size: 1.1rem;
        }
        .admin-panel .form-group {
            margin-bottom: 0.6rem;
        }
        .admin-panel .btn {
            margin-right: 0.3rem;
            margin-bottom: 0.2rem;
        }
        .admin-panel .stat-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 0.4rem;
        }
        .admin-panel .stat-table th,
        .admin-panel .stat-table td {
            padding: 0.2rem 0.4rem;
            border: 1px solid #dce0e8;
            text-align: left;
        }
        body.dark .admin-panel .stat-table th,
        body.dark .admin-panel .stat-table td {
            border-color: #2a2a40;
        }
        .admin-panel .stat-table th {
            background: #eef2f8;
        }
        body.dark .admin-panel .stat-table th {
            background: #1a1a2a;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a73e8;
            color: #fff;
            padding: 0.6rem 1.5rem;
            border-radius: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            font-weight: 500;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            font-size: 0.9rem;
        }
        body.dark .notification {
            background: #1a2a4a;
            color: #eaeef5;
        }
        .notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .notification.hide {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
        }
        .loading-state {
            text-align: center;
            padding: 2rem 1rem;
            color: #6a7a9a;
        }
        .loading-state i {
            font-size: 1.8rem;
            margin-right: 0.4rem;
        }
        .log-entry {
            padding: 0.15rem 0.4rem;
            border-bottom: 1px solid #2a2a40;
            font-size: 0.75rem;
            font-family: monospace;
            color: #b0b8d0;
        }
        .log-entry .log-time {
            color: #6a7a9a;
        }
        .log-entry .log-user {
            color: #f0b400;
        }
        .log-entry .log-action {
            color: #8ab4ff;
        }
        .banned-item {
            display: flex;
            justify-content: space-between;
            padding: 0.2rem 0.4rem;
            border-bottom: 1px solid #2a2a40;
            font-size: 0.8rem;
            align-items: center;
        }
        .banned-item .banned-name {
            color: #ea4335;
            font-weight: 500;
        }
        .banned-item .unban-btn {
            padding: 0.05rem 0.5rem;
            font-size: 0.65rem;
            border-radius: 30px;
            border: 1px solid #ea4335;
            background: transparent;
            color: #ea4335;
            cursor: pointer;
            transition: 0.15s;
        }
        .banned-item .unban-btn:hover {
            background: #ea4335;
            color: #fff;
        }

        /* === СТИЛИ ДЛЯ ЧАТА === */
        .chat-msg {
            padding: 0.3rem 0.5rem;
            border-bottom: 1px solid #1a1a2a;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .chat-msg .msg-author {
            color: #f0b400;
            font-weight: 600;
        }
        .chat-msg .msg-text {
            color: #b0b8d0;
        }
        .chat-msg .msg-time {
            color: #6a7a9a;
            font-size: 0.65rem;
            margin-left: 0.4rem;
        }
        .chat-msg .delete-msg-btn {
            background: none;
            border: none;
            color: #8a8aa0;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            transition: 0.2s;
            border-radius: 30px;
        }
        .chat-msg .delete-msg-btn:hover {
            color: #ea4335;
            background: rgba(234, 67, 53, 0.1);
        }
        .chat-msg.deleting {
            opacity: 0;
            transform: translateX(-20px);
        }
        .chat-modal .chat-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #2a2a44;
            border-radius: 14px;
            padding: 0.3rem;
            background: #0d0d1a;
            min-height: 250px;
            max-height: 350px;
        }
        .chat-modal .chat-input-row {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        .chat-modal .chat-input-row input {
            flex: 1;
            padding: 0.4rem 0.8rem;
            border-radius: 60px;
            border: 1px solid #3a3a5a;
            background: #22223a;
            color: #eaeef5;
            font-family: inherit;
            outline: none;
            font-size: 0.85rem;
        }
        .chat-modal .chat-input-row input:focus {
            border-color: #1a73e8;
        }
        .chat-modal .chat-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        /* Стиль для бейджа счётчика (скрыт по умолчанию) */
        .chat-badge {
            background: #ea4335;
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 0.05rem 0.45rem;
            border-radius: 40px;
            margin-left: 0.2rem;
            display: none;
            line-height: 1.2;
            min-width: 18px;
            text-align: center;
        }

        /* === НОВЫЕ СТИЛИ ДЛЯ СВЯЗИ С АДМИНИСТРАЦИЕЙ === */
        #supportModal .modal-content {
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 1.2rem;
            background: #1a1a2a;
            border: 1px solid #2a2a44;
            border-radius: 28px;
        }
        #supportModal .modal-content h2 {
            color: #f0b400;
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }
        #supportMessages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #2a2a44;
            border-radius: 14px;
            padding: 0.5rem;
            background: #0d0d1a;
            min-height: 200px;
            max-height: 300px;
            margin-bottom: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .support-msg {
            padding: 0.3rem 0.5rem;
            border-radius: 12px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 0.85rem;
            line-height: 1.3;
        }
        .support-msg.mine {
            align-self: flex-end;
            background: #1a73e8;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .support-msg.other {
            align-self: flex-start;

        function saveTask() {
            const subject = document.getElementById('formSubject').value.trim();
            const text = document.getElementById('formText').value.trim();
            const date = document.getElementById('formDate').value;
            const author = document.getElementById('formAuthor').value.trim() || currentUser;
            const attachment = document.getElementById('formAttachment').value.trim();

            if (!subject) { alert('Введите предмет!'); return; }
            if (!text) { alert('Введите описание задания!'); return; }
            if (!date) { alert('Выберите дату!'); return; }

            if (bannedUsers.indexOf(author) !== -1) {
                alert('❌ Вы забанены и не можете добавлять задания!');
                return;
            }

            if (isSending) {
                alert('⏳ Подождите 15 секунд перед отправкой следующего задания');
                return;
            }

            saveStatusEl.textContent = '⏳ Сохранение...';
            saveStatusEl.style.color = '#1a73e8';

            const taskData = {
                subject: subject,
                text: text,
                date: date,
                author: author,
                attachment: attachment,
                done: false,
                likes: [],
                pinned: false,
                timestamp: Date.now()
            };

            let promise;
            let isNew = false;
            if (editingId) {
                const old = tasks.find(function(t) { return t.id === editingId; });
                if (old) {
                    taskData.likes = old.likes || [];
                    taskData.timestamp = old.timestamp || Date.now();
                    taskData.pinned = old.pinned || false;
                }
                promise = tasksRef.child(editingId).update(taskData);
                addLog('Редактирование задания', 'ID: ' + editingId + ', предмет: ' + subject);
            } else {
                isNew = true;
                promise = tasksRef.push().set(taskData);
                addLog('Добавление задания', 'Предмет: ' + subject + ', автор: ' + author);
            }

            promise.then(function() {
                saveStatusEl.textContent = '✅ Сохранено!';
                saveStatusEl.style.color = '#34a853';
                const saveBtn = document.getElementById('saveBtn');
                if (!isNew) {
                    setTimeout(function() { closeModal(); }, 800);
                } else {
                    saveStatusEl.textContent = '✅ Отправлено!';
                    document.getElementById('sendStatus').textContent = '⏳ Подождите 15с перед следующим';
                    saveBtn.disabled = true;
                    saveBtn.style.opacity = '0.6';
                    saveBtn.style.cursor = 'not-allowed';
                    isSending = true;
                    let seconds = 15;
                    if (sendTimer) clearInterval(sendTimer);
                    sendTimer = setInterval(function() {
                        seconds--;
                        if (seconds <= 0) {
                            clearInterval(sendTimer);
                            sendTimer = null;
                            saveBtn.disabled = false;
                            saveBtn.style.opacity = '1';
                            saveBtn.style.cursor = 'pointer';
                            document.getElementById('sendStatus').textContent = '';
                            isSending = false;
                        } else {
                            document.getElementById('sendStatus').textContent = '⏳ Подождите ' + seconds + 'с';
                        }
                    }, 1000);
                    setTimeout(function() { closeModal(); }, 800);
                }
                if (isNew) {
                    const msg = '📚 <b>Новое задание в 6-1!</b>\n' +
                        'Предмет: ' + subject + '\n' +
                        'Задание: ' + text + '\n' +
                        'Автор: ' + author + '\n' +
                        'Дата: ' + date.split('-').reverse().join('.');
                    sendToTelegram(msg).catch(function(e) { console.warn('Telegram error:', e); });
                }
            }).catch(function(err) {
                saveStatusEl.textContent = '❌ Ошибка: ' + err.message;
                saveStatusEl.style.color = '#ea4335';
                console.error('❌ Save error:', err);
                const saveBtn = document.getElementById('saveBtn');
                saveBtn.disabled = false;
                saveBtn.style.opacity = '1';
                saveBtn.style.cursor = 'pointer';
                document.getElementById('sendStatus').textContent = '';
                isSending = false;
                if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
            });
        }

        function render() {
            if (isLoading) {
                taskListEl.innerHTML =
                '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i> Загрузка заданий...</div>';
                return;
            }

            const day = dayFilter.value;
            const subject = subjectFilter.value;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const weekEnd = new Date(today);
            weekEnd.setDate(weekEnd.getDate() + 7);

            let filtered = tasks.filter(function(task) {
                if (subject !== 'all' && task.subject !== subject) return false;
                if (day !== 'all') {
                    const taskDate = new Date(task.date + 'T00:00:00');
                    if (day === 'today' && (taskDate < today || taskDate >= tomorrow)) return false;
                    if (day === 'tomorrow' && (taskDate < tomorrow || taskDate >= new Date(tomorrow.getTime() +
                            86400000))) return false;
                    if (day === 'week' && (taskDate < today || taskDate >= weekEnd)) return false;
                }
                return true;
            });

            filtered.sort(function(a, b) {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                const da = new Date(a.date + 'T00:00:00');
                const db = new Date(b.date + 'T00:00:00');
                return da - db;
            });

            taskCountEl.textContent = tasks.length;
            footerCountEl.textContent = tasks.length;

            const list = taskListEl;
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Заданий пока нет</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(function(task) {
                const taskDate = new Date(task.date + 'T00:00:00');
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                const isOverdue = !task.done && taskDate < now;
                const dateStr = task.date.split('-').reverse().join('.');
                const dayOfWeek = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][taskDate.getDay()];

                const author = task.author || 'Аноним';
                const initials = author.split(' ').map(function(s) { return s[0]; }).join('').toUpperCase().slice(0, 2);

                let attachHtml = '';
                if (task.attachment && task.attachment.trim() !== '') {
                    const url = task.attachment.trim();
                    if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(url)) {
                        attachHtml = '<div class="task-attachment"><img src="' + url + '" alt="фото" loading="lazy"></div>';
                    } else {
                        attachHtml = '<div class="task-attachment"><i class="fas fa-paperclip"></i> <a href="' + url +
                            '" target="_blank">Ссылка</a></div>';
                    }
                }

                const likes = task.likes || [];
                const userLiked = likes.indexOf(currentUser) !== -1;
                const likeCount = likes.length;

                let adminButtons = '';
                if (isAdmin || task.author === currentUser) {
                    adminButtons +=
                        '<button class="btn btn-outline btn-sm editBtn" data-id="' + task.id +
                        '"><i class="fas fa-edit"></i></button>' +
                        '<button class="btn btn-danger btn-sm deleteBtn" data-id="' + task.id +
                        '"><i class="fas fa-trash"></i></button>';
                }
                if (isAdmin) {
                    adminButtons +=
                        '<button class="pin-btn ' + (task.pinned ? 'active' : '') + '" data-id="' + task.id +
                        '" title="Закрепить"><i class="fas fa-thumbtack"></i></button>';
                }

                const isBanned = bannedUsers.indexOf(currentUser) !== -1;

                html +=
                    '<div class="card ' + (task.pinned ? 'pinned' : '') + '" data-id="' + task.id + '">' +
                    '<div class="task-header">' +
                    '<span class="task-subject">' + (task.pinned ? '⭐ ' : '') + task.subject + '</span>' +
                    '<span class="task-date ' + (isOverdue ? 'overdue' : '') + '">' +
                    '<i class="far fa-calendar-alt"></i> ' + dateStr + ' (' + dayOfWeek + ')' +
                    (isOverdue ? ' <i class="fas fa-exclamation-triangle"></i>' : '') +
                    '</span>' +
                    '</div>' +
                    '<div class="task-text">' + task.text + '</div>' +
                    attachHtml +
                    '<div class="task-footer">' +
                    '<div class="author-block">' +
                    '<div class="avatar">' + initials + '</div>' +
                    '<div>' +
                    '<span class="author-name">' + author + '</span>' +
                    '<span class="author-time"> · <i class="far fa-clock"></i> ' + new Date(task.timestamp || task.id)
                    .toLocaleString('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) +
                    '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="task-actions">' +
                    '<button class="like-btn ' + (userLiked ? 'liked' : '') + (isBanned ? ' disabled' : '') +
                    '" data-id="' + task.id + '" ' + (isBanned ? 'style="opacity:0.4;cursor:not-allowed;"' : '') + '>' +
                    '<i class="fas fa-heart"></i>' +
                    '<span class="like-count">' + likeCount + '</span>' +
                    '</button>' +
                    adminButtons +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });
            list.innerHTML = html;

            list.querySelectorAll('.like-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.classList.contains('disabled')) return;
                    const id = this.dataset.id;
                    toggleLike(id);
                });
            });
            list.querySelectorAll('.editBtn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    openEditModal(id);
                });
            });
            list.querySelectorAll('.deleteBtn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (confirm('Удалить задание?')) {
                        const task = tasks.find(function(t) { return t.id === id; });
                        if (task) addLog('Удаление задания', 'Предмет: ' + task.subject + ', автор: ' + task.author);
                        tasksRef.child(id).remove().catch(function(err) { alert('Ошибка: ' + err.message); });
                    }
                });
            });
            list.querySelectorAll('.pin-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    togglePin(id);
                });
            });
        }

        function toggleLike(taskId) {
            if (bannedUsers.indexOf(currentUser) !== -1) {
                showNotification('❌ Вы забанены и не можете ставить лайки!', 3000);
                return;
            }
            const task = tasks.find(function(t) { return t.id === taskId; });
            if (!task) return;
            const likes = task.likes || [];
            const idx = likes.indexOf(currentUser);
            let action = 'Добавление лайка';
            if (idx === -1) {
                likes.push(currentUser);
                action = 'Лайк +1';
            } else {
                likes.splice(idx, 1);
                action = 'Лайк -1';
            }
            tasksRef.child(taskId).update({ likes: likes });
            addLog(action, 'Задание: ' + task.subject + ', автор: ' + task.author);
        }

        function togglePin(taskId) {
            if (!isAdmin) return;
            const task = tasks.find(function(t) { return t.id === taskId; });
            if (!task) return;
            tasksRef.child(taskId).update({ pinned: !task.pinned });
            addLog('Закрепление задания', 'Предмет: ' + task.subject + ' (статус: ' + (!task.pinned ? 'закреплён' :
                'откреплён') + ')');
        }

        function showStats() {
            if (!isAdmin) return;
            const stats = {};
            tasks.forEach(function(task) {
                const author = task.author || 'Аноним';
                if (!stats[author]) stats[author] = { tasks: 0, likes: 0 };
                stats[author].tasks++;
                const likes = task.likes || [];
                stats[author].likes += likes.length;
            });
            let html = '<h4>📊 Статистика класса</h4><table class="stat-table"><tr><th>Ученик</th><th>Заданий</th><th>Лайков</th></tr>';
            const sorted = Object.entries(stats).sort(function(a, b) { return b[1].tasks - a[1].tasks; });
            sorted.forEach(function(entry) {
                html += '<tr><td>' + entry[0] + '</td><td>' + entry[1].tasks + '</td><td>' + entry[1].likes +
                    '</td></tr>';
            });
            html += '</table>';
            adminStats.innerHTML = html;

            saveBtn.disabled = false;
            saveBtn.style.opacity = '1';
            saveBtn.style.cursor = 'pointer';
            if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
            isSending = false;

            modalTitle.textContent = title;
            if (data) {
                formSubject.value = data.subject || '';
                formText.value = data.text || '';
                formDate.value = data.date || '';
                formAuthor.value = data.author || '';
                formAttachment.value = data.attachment || '';
                editIdInput.value = data.id || '';
                editingId = data.id || null;
            } else {
                formSubject.value = '';
                formText.value = '';
                formDate.value = new Date().toISOString().split('T')[0];
                formAuthor.value = currentUser;
                formAttachment.value = '';
                editIdInput.value = '';
                editingId = null;
            }
            saveStatusEl.textContent = '';
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            editingId = null;
        }

        function openAddModal() {
            openModal('Новое задание', null);
        }

        function openEditModal(id) {
            const task = tasks.find(function(t) { return t.id === id; });
            if (!task) return;
            if (!isAdmin && task.author !== currentUser) {
                alert('Вы можете редактировать только свои задания.');
                return;
            }
            openModal('Редактировать задание', task);
        }

        addBtn.addEventListener('click', openAddModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        document.getElementById('saveBtn').addEventListener('click', saveTask);

        document.querySelectorAll('#taskForm input, #taskForm textarea').forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && this.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    saveTask();
                }
            });
        });

        dayFilter.addEventListener('change', render);
        subjectFilter.addEventListener('change', render);
        resetFiltersBtn.addEventListener('click', function() {
            dayFilter.value = 'all';
            subjectFilter.value = 'all';
            render();
        });

        // ---------- СЧЁТЧИК НЕПРОЧИТАННЫХ СООБЩЕНИЙ (С СОХРАНЕНИЕМ) ----------
        // Загружаем сохранённый timestamp из localStorage
        const savedTimestamp = localStorage.getItem('hw6_lastReadTimestamp');
        if (savedTimestamp) {
            lastReadTimestamp = parseInt(savedTimestamp, 10);
        } else {
            lastReadTimestamp = Date.now();
        }

        function updateUnreadCount() {
            chatRef.orderByChild('timestamp').startAt(lastReadTimestamp + 1).once('value', function(snapshot) {
                const data = snapshot.val();
                const badge = document.querySelector('.chat-badge');
                if (!badge) return;
                if (!data) {
                    badge.style.display = 'none';
                    badge.textContent = '0';
                    return;
                }
                const messages = Object.values(data);
                const unread = messages.filter(function(msg) {
                    return msg.author !== currentUser;
                });
                unreadCount = unread.length;
                if (unreadCount > 0) {
                    badge.style.display = 'inline-block';
                    badge.textContent = unreadCount;
                } else {
                    badge.style.display = 'none';
                    badge.textContent = '0';
                }
            });
        }

        // Создаём бейдж для кнопки чата (скрытый по умолчанию)
        const chatBtn = document.getElementById('chatToggleBtn');
        if (chatBtn) {
            const badge = document.createElement('span');
            badge.className = 'chat-badge';
            badge.textContent = '0';
            badge.style.display = 'none';
            chatBtn.appendChild(badge);
        }

        // Наблюдатель за открытием чата с сохранением
        const observer = new MutationObserver(function() {
            if (chatModal.classList.contains('active')) {
                chatRef.orderByChild('timestamp').startAt(lastReadTimestamp + 1).once('value', function(snapshot) {
                    const data = snapshot.val();
                    if (data) {
                        const updates = {};
                        Object.keys(data).forEach(function(key) {
                            if (data[key].author !== currentUser) {
                                updates[key + '/unread'] = false;
                            }
                        });
                        chatRef.update(updates);
                    }
                });
                lastReadTimestamp = Date.now();
                localStorage.setItem('hw6_lastReadTimestamp', lastReadTimestamp.toString());
                const badge = document.querySelector('.chat-badge');
                if (badge) {
                    badge.style.display = 'none';
                    badge.textContent = '0';
                }
                unreadCount = 0;
            }
        });
        observer.observe(chatModal, { attributes: true, attributeFilter: ['class'] });

        // Подписка на новые сообщения с сохранением
        chatRef.orderByChild('timestamp').startAt(lastReadTimestamp + 1).on('child_added', function(snapshot) {
            const data = snapshot.val();
            if (!data) return;
            if (chatModal.classList.contains('active')) {
                lastReadTimestamp = Date.now();
                localStorage.setItem('hw6_lastReadTimestamp', lastReadTimestamp.toString());
                return;
            }
            if (data.author === currentUser) return;
            unreadCount++;
            const badge = document.querySelector('.chat-badge');
            if (badge) {
                badge.style.display = 'inline-block';
                badge.textContent = unreadCount;
            }
        });

        // Устанавливаем начальный timestamp
        setTimeout(updateUnreadCount, 1000);

        // ---------- ЧАТ С МОМЕНТАЛЬНЫМ УДАЛЕНИЕМ ----------
        function appendChatMessage(data) {
            if (!chatMessages) return;
            if (chatMessages.querySelector('.chat-placeholder')) {
                chatMessages.innerHTML = '';
            }
            const time = new Date(data.timestamp).toLocaleString('ru', {
                hour: '2-digit',
                minute: '2-digit'
            });
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.dataset.id = data.id || '';
            const isBanned = bannedUsers.indexOf(currentUser) !== -1;
            const canDelete = !isBanned && (isAdmin || data.author === currentUser);
            div.innerHTML = `
                <div>
                    <span class="msg-author">${data.author || 'Аноним'}</span>
                    <span class="msg-text">: ${data.text}</span>
                    <span class="msg-time">${time}</span>
                </div>
                ${canDelete ? `<button class="delete-msg-btn" data-id="${data.id || ''}"><i class="fas fa-trash-alt"></i></button>` : ''}
            `;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            div.querySelector('.delete-msg-btn')?.addEventListener('click', function() {
                const id = this.dataset.id;
                if (!id) return;
                if (!confirm('Удалить сообщение?')) return;
                div.style.transition = 'all 0.3s ease';
                div.style.opacity = '0';
                div.style.transform = 'translateX(-20px)';
                setTimeout(() => {
                    chatRef.child(id).remove()
                        .then(() => {
                            if (div.parentNode) {
                                div.remove();
                            }
                            showNotification('🗑️ Сообщение удалено', 1500);
                        })
                        .catch(function(e) {
                            alert('Ошибка удаления: ' + e.message);
                            div.style.opacity = '1';
                            div.style.transform = 'translateX(0)';
                        });
                }, 300);
            });
        }

        function sendChatMessage() {
            if (!currentUser) {
                alert('Пожалуйста, войдите в систему');
                return;
            }
            if (bannedUsers.indexOf(currentUser) !== -1) {
                alert('❌ Вы забанены и не можете писать в чат!');
                return;
            }
            const text = chatInput.value.trim();
            if (!text) return;
            chatRef.push({
                text: text,
                author: currentUser,
                timestamp: Date.now()
            }).then(function() {
                chatInput.value = '';
            }).catch(function(e) {
                alert('Ошибка: ' + e.message);
            });
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        chatToggleBtn.addEventListener('click', function() {
            chatModal.classList.toggle('active');
            if (chatModal.classList.contains('active')) {
                chatMessages.innerHTML =
                '<div class="chat-placeholder" style="color:#6a7a9a;text-align:center;padding:0.8rem;">Загрузка...</div>';
                chatRef.once('value', function(snapshot) {
                    const data = snapshot.val();
                    chatMessages.innerHTML = '';
                    if (data) {
                        const messages = Object.entries(data).map(function(entry) {
                            return { id: entry[0], ...entry[1] };
                        });
                        messages.sort(function(a, b) { return a.timestamp - b.timestamp; });
                        messages.forEach(function(msg) {
                            appendChatMessage(msg);
                        });
                    } else {
                        chatMessages.innerHTML =
                            '<div class="chat-placeholder" style="color:#6a7a9a;text-align:center;padding:0.8rem;">Сообщений пока нет</div>';
                    }
                    chatRef.off();
                    chatRef.orderByChild('timestamp').startAfter(Date.now() - 1000).on('child_added', function(
                    snapshot) {
                        const data = snapshot.val();
                        if (!data) return;
                        const existing = chatMessages.querySelector(`[data-id="${snapshot.key}"]`);
                        if (!existing) {
                            appendChatMessage({ id: snapshot.key, ...data });
                        }
                    });
                    chatRef.on('child_removed', function(snapshot) {
                        const removedId = snapshot.key;
                        const msgEl = chatMessages.querySelector(`[data-id="${removedId}"]`);
                        if (msgEl) {
                            msgEl.style.transition = 'all 0.3s ease';
                            msgEl.style.opacity = '0';
                            msgEl.style.transform = 'translateX(-20px)';
                            setTimeout(() => {
                                if (msgEl.parentNode) {
                                    msgEl.remove();
                                }
                            }, 300);
                        }
                    });
                });
            }
        });

        chatCloseBtn.addEventListener('click', function() {
            chatModal.classList.remove('active');
        });

        function updateChatClearBtn() {
            if (isSuperAdmin) {
                chatClearBtn.style.display = 'inline-flex';
            } else {
                chatClearBtn.style.display = 'none';
            }
        }

        chatClearBtn.addEventListener('click', function() {
            if (!isSuperAdmin) {
                alert('Только суперадмин может очистить чат!');
                return;
            }
            if (!confirm('Очистить весь чат?')) return;
            chatRef.remove().then(function() {
                chatMessages.innerHTML = '<div style="color:#6a7a9a;text-align:center;padding:0.8rem;">Чат очищен</div>';
                showNotification('Чат очищен', 3000);
            }).catch(function(e) {
                alert('Ошибка: ' + e.message);
            });
        });

        const originalUpdateAdminUI = updateAdminUI;
        if (originalUpdateAdminUI) {
            window.updateAdminUI = function() {
                originalUpdateAdminUI();
                updateChatClearBtn();
            };
        }
        updateChatClearBtn();

        // ---------- СВЯЗЬ С АДМИНИСТРАЦИЕЙ ----------
        // Открытие модалки поддержки
        supportBtn.addEventListener('click', function() {
            if (!currentUser) {
                alert('Пожалуйста, войдите в систему');
                return;
            }
            supportModal.classList.add('active');
            loadSupportMessages();
            setTimeout(function() {
                supportInput.focus();
            }, 300);
        });

        supportCloseBtn.addEventListener('click', function() {
            supportModal.classList.remove('active');
        });

        supportModal.addEventListener('click', function(e) {
            if (e.target === supportModal) supportModal.classList.remove('active');
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') supportModal.classList.remove('active');
        });

        // Загрузка сообщений поддержки
        function loadSupportMessages() {
            const isAdminUser = isAdmin || isSuperAdmin;
            const user = currentUser;

            let query;
            if (isAdminUser) {
                query = supportRef.orderByChild('timestamp');
            } else {
                query = supportRef.orderByChild('userId').equalTo(user);
            }

            query.once('value', function(snapshot) {
                const data = snapshot.val();
                supportMessages.innerHTML = '';
                if (!data) {
                    supportMessages.innerHTML = '<div style="color:#6a7a9a;text-align:center;padding:1rem;">📭 Нет сообщений</div>';
                    return;
                }

                let messages = Object.entries(data).map(function(entry) {
                    return { id: entry[0], ...entry[1] };
                });

                if (isAdminUser) {
                    messages.sort(function(a, b) { return a.timestamp - b.timestamp; });
                    let html = '';
                    messages.forEach(function(msg) {
                        const time = new Date(msg.timestamp).toLocaleString('ru', {
                            hour: '2-digit', minute: '2-digit'
                        });
                        const isFromAdmin = msg.from === 'admin' || msg.from === 'superadmin';
                        const sender = isFromAdmin ? 'Администрация' : msg.userId;
                        const msgClass = isFromAdmin ? 'other' : 'mine';
                        // Кнопка удаления для админа (все сообщения) и для автора
                        const canDelete = isAdminUser || msg.userId === currentUser;
                        html += `
                            <div class="support-msg ${msgClass}" data-id="${msg.id}">
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <div class="msg-author">${sender}</div>
                                    <div>
                                        <span class="msg-time">${time}</span>
                                        ${canDelete ? `<button class="delete-support-msg" data-id="${msg.id}"><i class="fas fa-trash-alt"></i></button>` : ''}
                                    </div>
                                </div>
                                <div class="msg-text">${msg.text}</div>
                                ${!isFromAdmin && isAdminUser ? `
                                    <button class="reply-btn" data-userid="${msg.userId}"><i class="fas fa-reply"></i> Ответить</button>
                                ` : ''}
                            </div>
                        `;
                    });
                    supportMessages.innerHTML = html;

                    // Обработчики удаления
                    supportMessages.querySelectorAll('.delete-support-msg').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            if (!id) return;
                            if (!confirm('Удалить сообщение?')) return;
                            supportRef.child(id).remove()
                                .then(function() {
                                    showNotification('🗑️ Сообщение удалено', 1500);
                                    loadSupportMessages();
                                })
                                .catch(function(e) {
                                    alert('Ошибка удаления: ' + e.message);
                                });
                        });
                    });

                    supportMessages.querySelectorAll('.reply-btn').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const userId = this.dataset.userid;
                            supportInput.value = '@' + userId + ' ';
                            supportInput.focus();
                        });
                    });
                } else {
                    messages = messages.filter(function(msg) {
                        return msg.userId === user || msg.from === 'admin' || msg.from === 'superadmin';
                    });
                    messages.sort(function(a, b) { return a.timestamp - b.timestamp; });
                    let html = '';
                    if (messages.length === 0) {
                        html = '<div style="color:#6a7a9a;text-align:center;padding:1rem;">📭 Нет сообщений</div>';
                    } else {
                        messages.forEach(function(msg) {
                            const time = new Date(msg.timestamp).toLocaleString('ru', {
                                hour: '2-digit', minute: '2-digit'
                            });
                            const isFromAdmin = msg.from === 'admin' || msg.from === 'superadmin';
                            const sender = isFromAdmin ? 'Администрация' : 'Вы';
                            const msgClass = isFromAdmin ? 'other' : 'mine';
                            // Пользователь может удалять только свои сообщения
                            const canDelete = msg.userId === currentUser;
                            html += `
                                <div class="support-msg ${msgClass}" data-id="${msg.id}">
                                    <div style="display:flex;justify-content:space-between;align-items:center;">
                                        <div class="msg-author">${sender}</div>
                                        <div>
                                            <span class="msg-time">${time}</span>
                                            ${canDelete ? `<button class="delete-support-msg" data-id="${msg.id}"><i class="fas fa-trash-alt"></i></button>` : ''}
                                        </div>
                                    </div>
                                    <div class="msg-text">${msg.text}</div>
                                </div>
                            `;
                        });
                    }
                    supportMessages.innerHTML = html;

                    supportMessages.querySelectorAll('.delete-support-msg').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            if (!id) return;
                            if (!confirm('Удалить сообщение?')) return;
                            supportRef.child(id).remove()
                                .then(function() {
                                    showNotification('🗑️ Сообщение удалено', 1500);
                                    loadSupportMessages();
                                })
                                .catch(function(e) {
                                    alert('Ошибка удаления: ' + e.message);
                                });
                        });
                    });
                }
                supportMessages.scrollTop = supportMessages.scrollHeight;
            });
        }

        // Отправка сообщения в поддержку
        function sendSupportMessage() {
            const text = supportInput.value.trim();
            if (!text) return;

            const isAdminUser = isAdmin || isSuperAdmin;
            const msgData = {
                userId: currentUser,
                text: text,
                timestamp: Date.now(),
                from: isAdminUser ? (isSuperAdmin ? 'superadmin' : 'admin') : 'user',
                read: false
            };

            supportRef.push(msgData).then(function() {
                supportInput.value = '';
                supportStatus.textContent = '✅ Сообщение отправлено';
                supportStatus.style.color = '#34a853';
                loadSupportMessages();
                if (!isAdminUser) {
                    showNotification('📩 Новое сообщение в поддержку от ' + currentUser, 5000);
                    if (isSuperAdmin) {
                        sendToTelegram('📩 Новое сообщение в поддержку от ' + currentUser + ': ' + text);
                    }
                }
                setTimeout(function() {
                    supportStatus.textContent = '';
                }, 3000);
            }).catch(function(err) {
                supportStatus.textContent = '❌ Ошибка: ' + err.message;
                supportStatus.style.color = '#ea4335';
            });
        }

        supportSendBtn.addEventListener('click', sendSupportMessage);
        supportInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendSupportMessage();
        });

        // Подписка на новые сообщения в поддержке
        function watchSupportMessages() {
            if (!currentUser) return;
            const isAdminUser = isAdmin || isSuperAdmin;

            if (!isAdminUser) {
                supportRef.orderByChild('userId').equalTo(currentUser).on('child_added', function(snapshot) {
                    const data = snapshot.val();
                    if (!data) return;
                    if (data.from === 'admin' || data.from === 'superadmin') {
                        showPersistentNotification('📩 Сообщение от администрации: ' + data.text);
                        if (supportModal.classList.contains('active')) {
                            loadSupportMessages();
                        }
                    }
                });
            } else {
                supportRef.limitToLast(1).on('child_added', function(snapshot) {
                    const data = snapshot.val();
                    if (!data) return;
                    if (data.from === 'user') {
                        showNotification('📩 Новое сообщение в поддержку от ' + data.userId, 5000);
                        if (supportModal.classList.contains('active')) {
                            loadSupportMessages();
                        }
                    }
                });
            }
        }

        // ---------- НЕЗАКРЫВАЕМЫЕ УВЕДОМЛЕНИЯ ----------
        function showPersistentNotification(text) {
            const notificationId = 'notif_' + btoa(text).slice(0, 20);
            const closed = localStorage.getItem('closed_' + notificationId);
            if (closed === 'true') return;

            document.querySelectorAll('.persistent-notification').forEach(function(el) {
                el.remove();
            });

            const notif = document.createElement('div');
            notif.className = 'persistent-notification';
            notif.id = notificationId;
            notif.innerHTML = `
                <div class="notif-content">
                    <div class="notif-text">
                        <i class="fas fa-envelope"></i>
                        <span>${text}</span>
                    </div>
                    <button class="notif-btn" onclick="openSupportAndClose('${notificationId}')">
                        <i class="fas fa-reply"></i> Перейти к сообщению
                    </button>
                </div>
            `;

            document.body.appendChild(notif);
            localStorage.setItem('shown_' + notificationId, 'true');
        }

        window.openSupportAndClose = function(notificationId) {
            const notif = document.getElementById(notificationId);
            if (notif) {
                notif.style.transition = 'all 0.3s ease';
                notif.style.opacity = '0';
                notif.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(function() {
                    notif.remove();
                }, 300);
            }
            localStorage.setItem('closed_' + notificationId, 'true');

            supportModal.classList.add('active');
            loadSupportMessages();
            setTimeout(function() {
                supportInput.focus();
            }, 400);
        };

        function checkPersistentNotifications() {
            const keys = Object.keys(localStorage);
            keys.forEach(function(key) {
                if (key.startsWith('shown_') && key.includes('notif_')) {
                    const notificationId = key.replace('shown_', '');
                    const closed = localStorage.getItem('closed_' + notificationId);
                    if (closed !== 'true') {
                        const text = atob(notificationId.replace('notif_', ''));
                        showPersistentNotification(text);
                    }
                }
            });
        }

        // Переопределяем showNotification для перехвата админских сообщений
        const originalShowNotification = showNotification;
        window.showNotification = function(text, duration) {
            const isAdminMessage = text.toLowerCase().includes('администрац') ||
                                   text.toLowerCase().includes('админ') ||
                                   text.toLowerCase().includes('от админа');
            if (isAdminMessage) {
                showPersistentNotification(text);
            } else {
                originalShowNotification(text, duration);
            }
        };

        // ---------- ЗАПУСК ----------
        setTimeout(function() {
            checkPersistentNotifications();
            if (currentUser) {
                watchSupportMessages();
            }
        }, 1000);

        console.log('🚀 Сайт загружен с поддержкой и незакрываемыми уведомлениями');
        checkAdminRights();
        if (isAdmin) showStats();
        if (isSuperAdmin) {
            adminManageGroup.style.display = 'block';
            logGroup.style.display = 'block';
            bannedListGroup.style.display = 'block';
            loadLogs();
            loadBannedList();
        }
        updateAdminUI();
        loadTasks();
    </script>
</body>
</html>
