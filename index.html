<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ДЗ · 6-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f5f7fc;
            color: #1a1a2e;
            transition: 0.2s;
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        body.dark {
            background: #12121a;
            color: #eaeef5;
        }
        body.dark .card {
            background: #1e1e2e;
            border-color: #2e2e44;
        }
        body.dark .filter-bar {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .filter-bar select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .modal-content {
            background: #1a1a2a;
            border-color: #2e2e44;
        }
        body.dark .modal-content input,
        body.dark .modal-content textarea,
        body.dark .modal-content select {
            background: #2a2a3e;
            color: #eaeef5;
            border-color: #3a3a5a;
        }
        body.dark .task-date {
            background: #2a2a40;
            color: #b0b8d0;
        }
        body.dark .task-date.overdue {
            background: #3a1a1a;
            color: #ff9a9a;
        }
        body.dark .task-subject {
            background: #2a2a44;
            color: #8ab4ff;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .container {
            max-width: 820px;
            width: 100%;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #dce0e8;
        }
        body.dark .app-header {
            border-bottom-color: #2a2a40;
        }
        .app-header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .app-header h1 i {
            color: #1a73e8;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #c0c8d8;
            background: transparent;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;
            color: #1a1a2e;
            text-decoration: none;
        }
        body.dark .btn {
            color: #eaeef5;
            border-color: #3a4a6a;
        }
        .btn-primary {
            background: #1a73e8;
            border-color: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-outline {
            background: transparent;
        }
        .btn-outline:hover {
            background: #e8edf5;
        }
        body.dark .btn-outline:hover {
            background: #2a2a40;
        }
        .btn-danger {
            color: #d43f3f;
            border-color: #d43f3f;
        }
        .btn-danger:hover {
            background: #fce8e8;
        }
        body.dark .btn-danger {
            color: #ff7a7a;
            border-color: #6a2a2a;
        }
        body.dark .btn-danger:hover {
            background: #2a1a1a;
        }
        .btn-sm {
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
        }
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: inherit;
        }
        .admin-btn {
            border-color: #f0b400;
            color: #b8860b;
        }
        body.dark .admin-btn {
            border-color: #f0b400;
            color: #f0b400;
        }
        .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
            border-color: #f0b400;
        }
        body.dark .admin-btn.active {
            background: #f0b400;
            color: #1a1a2e;
        }
        .stat-item {
            background: #eef2f8;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #2a2a4a;
        }
        body.dark .stat-item {
            background: #1a1a2a;
            color: #b0b8d0;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            background: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #dce0e8;
            margin-bottom: 1.5rem;
            align-items: center;
        }
        .filter-bar label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a3a5a;
        }
        body.dark .filter-bar label {
            color: #b0b8d0;
        }
        .filter-bar select {
            border: 1px solid #d0d8e8;
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.8rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
        }
        .filter-bar .filter-reset {
            margin-left: auto;
            font-size: 0.75rem;
            color: #6a7a9a;
            cursor: pointer;
            border-bottom: 1px dashed #b0b8d0;
        }
        .filter-bar .filter-reset:hover {
            color: #1a73e8;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 1.2rem 1.5rem;
            border: 1px solid #e0e6f0;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .card:hover {
            border-color: #b0c8f0;
            transform: translateY(-2px);
        }
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .task-subject {
            font-weight: 600;
            background: #eef4ff;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            color: #1a5bb0;
            font-size: 0.85rem;
        }
        body.dark .task-subject {
            background: #1a2a4a;
            color: #8ab4ff;
        }
        .task-date {
            font-size: 0.75rem;
            background: #eef2f8;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            color: #3a4a6a;
        }
        .task-date.overdue {
            background: #ffebeb;
            color: #b52a2a;
        }
        .task-text {
            margin: 0.6rem 0;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .task-attachment {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0.3rem 0 0.6rem;
            font-size: 0.8rem;
            background: #f4f8ff;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            border: 1px solid #d0dcf0;
            width: fit-content;
        }
        body.dark .task-attachment {
            background: #1a1a30;
            border-color: #2a3a5a;
        }
        .task-attachment img {
            max-height: 120px;
            border-radius: 12px;
            border: 1px solid #d0d8e8;
        }
        .task-attachment a {
            color: #1a73e8;
            text-decoration: none;
            border-bottom: 1px dashed #a0b8e0;
        }
        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 0.6rem;
            padding-top: 0.6rem;
            border-top: 1px solid #e8ecf4;
        }
        body.dark .task-footer {
            border-top-color: #2a2a40;
        }
        .author-block {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 40px;
            background: #dce4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.7rem;
            color: #1a2a4a;
            text-transform: uppercase;
        }
        body.dark .avatar {
            background: #2a2a4a;
            color: #b8c8ff;
        }
        .author-name {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .author-time {
            font-size: 0.7rem;
            color: #6a7a9a;
        }
        body.dark .author-time {
            color: #8a8aa0;
        }
        .task-actions {
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #8a9ab8;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        .like-btn.liked {
            color: #e84a5f;
        }
        .like-btn .like-count {
            font-size: 0.75rem;
            font-weight: 500;
            color: #5a6a8a;
        }
        body.dark .like-btn .like-count {
            color: #8a8aa0;
        }
        .like-btn:hover {
            transform: scale(1.1);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: #fff;
            border-radius: 32px;
            max-width: 520px;
            width: 90%;
            padding: 2rem 1.8rem;
            border: 1px solid #e0e6f0;
            transform: scale(0.95);
            transition: 0.2s;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1);
        }
        .modal-content h2 {
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: #3a4a6a;
        }
        body.dark .form-group label {
            color: #b0b8d0;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #d0d8e8;
            border-radius: 60px;
            font-size: 0.9rem;
            background: #f8faff;
            font-family: inherit;
            outline: none;
            transition: 0.1s;
        }
        .form-group textarea {
            border-radius: 20px;
            min-height: 70px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #1a73e8;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1 1 140px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6a7a9a;
        }
        .empty-state i {
            font-size: 3rem;
            color: #c0c8d8;
            margin-bottom: 0.5rem;
        }
        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: #8a9ab8;
            border-top: 1px solid #e0e6f0;
            padding-top: 1rem;
        }
        body.dark .footer {
            border-top-color: #2a2a40;
            color: #6a7a9a;
        }
        @media (max-width: 600px) {
            body {
                padding: 0.8rem;
            }
            .app-header h1 {
                font-size: 1.4rem;
            }
            .filter-bar {
                border-radius: 20px;
                padding: 0.6rem;
            }
            .filter-bar label {
                width: 100%;
            }
            .filter-bar .filter-reset {
                margin-left: 0;
            }
            .card {
                padding: 1rem;
            }
            .modal-content {
                padding: 1.5rem;
            }
            .task-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .task-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1><i class="fas fa-home"></i> 6-1 · ДЗ</h1>
            <div class="header-actions">
                <span class="stat-item" id="taskCount">0</span>
                <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Добавить</button>
                <button class="btn btn-outline btn-sm admin-btn" id="adminBtn"><i class="fas fa-lock"></i> <span id="adminLabel">Админ</span></button>
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <div class="filter-bar">
            <label><i class="fas fa-calendar-day"></i> День
                <select id="dayFilter">
                    <option value="all">Все</option>
                    <option value="today">Сегодня</option>
                    <option value="tomorrow">Завтра</option>
                    <option value="week">Неделя</option>
                </select>
            </label>
            <label><i class="fas fa-tag"></i> Предмет
                <select id="subjectFilter">
                    <option value="all">Все</option>
                    <option value="Математика">Математика</option>
                    <option value="Физика">Физика</option>
                    <option value="Литература">Литература</option>
                    <option value="Информатика">Информатика</option>
                    <option value="Русский язык">Русский язык</option>
                    <option value="Английский язык">Английский язык</option>
                    <option value="Химия">Химия</option>
                    <option value="Биология">Биология</option>
                    <option value="История">История</option>
                    <option value="Обществознание">Обществознание</option>
                    <option value="География">География</option>
                    <option value="Другое">Другое</option>
                </select>
            </label>
            <span class="filter-reset" id="resetFilters"><i class="fas fa-undo-alt"></i> Сбросить</span>
        </div>

        <div id="status" style="text-align:center;margin-bottom:1rem;font-weight:500;color:#1a73e8;">Подключение...</div>
        <div class="task-list" id="taskList"></div>

        <div class="footer">
            <i class="fas fa-database"></i> Данные в облаке · <span id="footerCount">0</span> заданий
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <h2 id="modalTitle">Новое задание</h2>
            <form id="taskForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Предмет</label>
                    <input type="text" id="formSubject" placeholder="Например, Математика" required>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="formText" placeholder="Что нужно сделать?" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата выполнения</label>
                        <input type="date" id="formDate" required>
                    </div>
                    <div class="form-group">
                        <label>Автор</label>
                        <input type="text" id="formAuthor" placeholder="Ваше имя" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ссылка на фото (необязательно)</label>
                    <input type="text" id="formAttachment" placeholder="https://...">
                </div>
                <input type="hidden" id="editId" value="">
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="cancelModal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveBtn"><i class="fas fa-check"></i> Сохранить</button>
                </div>
            </form>
            <div id="saveStatus" style="margin-top:0.5rem;font-size:0.85rem;text-align:center;"></div>
        </div>
    </div>

    <script>
        // ---------- КОНФИГ FIREBASE ----------
        const firebaseConfig = {
            apiKey: "AIzaSyB55xY6dYAaysFfZeeJCWUGWDkMOuApFO",
            authDomain: "dz-6-1.firebaseapp.com",
            databaseURL: "https://dz-6-1-default-rtdb.firebaseio.com",
            projectId: "dz-6-1",
            storageBucket: "dz-6-1.firebasestorage.app",
            messagingSenderId: "338642525342",
            appId: "1:338642525342:web:bdf14ac6874ebf49dbfa5"
        };

        // ---------- ТЕЛЕГРАМ ----------
        const BOT_TOKEN = '8274411877:AAE94dt9DOFLXxuer5XSCpch3sZzNkj61UM';
        const CHAT_ID = '-1002883795807';

        // ---------- ПЕРЕМЕННЫЕ ----------
        let tasks = [];
        let currentUser = '';
        let isAdmin = false;
        const ADMIN_PASSWORD = 'tl132435534231t';
        let editingId = null;

        // ---------- ИНИЦИАЛИЗАЦИЯ FIREBASE ----------
        try {
            firebase.initializeApp(firebaseConfig);
            document.getElementById('status').textContent = '✅ Firebase подключён';
            console.log('Firebase OK');
        } catch (e) {
            document.getElementById('status').textContent = '❌ Ошибка Firebase: ' + e.message;
            console.error(e);
        }

        const db = firebase.database();
        const tasksRef = db.ref('tasks');

        // ---------- ЗАГРУЗКА ИМЕНИ ----------
        const savedName = localStorage.getItem('hw6_userName');
        if (savedName) {
            currentUser = savedName;
        } else {
            const name = prompt('Введите ваше имя (будет показано как автор):');
            if (name && name.trim()) {
                currentUser = name.trim();
                localStorage.setItem('hw6_userName', currentUser);
            } else {
                currentUser = 'Аноним';
            }
        }
        document.getElementById('formAuthor').value = currentUser;

        // ---------- АДМИН ----------
        document.getElementById('adminBtn').addEventListener('click', function() {
            if (isAdmin) {
                isAdmin = false;
                sessionStorage.removeItem('hw6_admin');
                this.classList.remove('active');
                document.getElementById('adminLabel').textContent = 'Админ';
                render();
                return;
            }
            const pass = prompt('Введите пароль админа:');
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                sessionStorage.setItem('hw6_admin', 'true');
                this.classList.add('active');
                document.getElementById('adminLabel').textContent = 'Админ (вкл)';
                render();
            } else if (pass !== null) {
                alert('Неверный пароль!');
            }
        });

        if (sessionStorage.getItem('hw6_admin') === 'true') {
            isAdmin = true;
            document.getElementById('adminBtn').classList.add('active');
            document.getElementById('adminLabel').textContent = 'Админ (вкл)';
        }

        // ---------- ТЕМА ----------
        document.getElementById('themeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark');
            const dark = document.body.classList.contains('dark');
            localStorage.setItem('hw6_theme', dark ? 'dark' : 'light');
            this.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });
        if (localStorage.getItem('hw6_theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
        }

        // ---------- ЗАГРУЗКА ЗАДАНИЙ ----------
        tasksRef.on('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                tasks = Object.entries(data).map(function(entry) {
                    return { id: entry[0], ...entry[1] };
                });
            } else {
                tasks = [];
            }
            render();
        });

        // ---------- ФУНКЦИЯ ОТПРАВКИ В ТЕЛЕГРАМ ----------
        function sendTelegram(message) {
            const url = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'HTML' })
            }).catch(function(e) { console.warn('Telegram error:', e); });
        }

        // ---------- ФУНКЦИЯ СОХРАНЕНИЯ (ОТДЕЛЬНАЯ) ----------
        function saveTask() {
            const subject = document.getElementById('formSubject').value.trim();
            const text = document.getElementById('formText').value.trim();
            const date = document.getElementById('formDate').value;
            const author = document.getElementById('formAuthor').value.trim() || currentUser;
            const attachment = document.getElementById('formAttachment').value.trim();

            // Проверка на пустые поля
            if (!subject) { alert('Введите предмет!'); return; }
            if (!text) { alert('Введите описание задания!'); return; }
            if (!date) { alert('Выберите дату!'); return; }

            // Показываем статус загрузки
            document.getElementById('saveStatus').textContent = '⏳ Сохранение...';
            document.getElementById('saveStatus').style.color = '#1a73e8';

            const taskData = {
                subject: subject,
                text: text,
                date: date,
                author: author,
                attachment: attachment,
                done: false,
                likes: [],
                timestamp: Date.now()
            };

            let promise;
            if (editingId) {
                // Редактирование существующего задания
                const old = tasks.find(function(t) { return t.id === editingId; });
                if (old) {
                    taskData.likes = old.likes || [];
                    taskData.timestamp = old.timestamp || Date.now();
                }
                promise = tasksRef.child(editingId).update(taskData);
            } else {
                // Новое задание
                promise = tasksRef.push().set(taskData);
            }

            promise.then(function() {
                document.getElementById('saveStatus').textContent = '✅ Сохранено!';
                document.getElementById('saveStatus').style.color = '#34a853';
                setTimeout(function() {
                    document.getElementById('saveStatus').textContent = '';
                    closeModal();
                }, 1000);

                // Отправка в Telegram только для новых заданий
                if (!editingId) {
                    const msg = '📚 <b>Новое задание в 6-1!</b>\n' +
                        'Предмет: ' + subject + '\n' +
                        'Задание: ' + text + '\n' +
                        'Автор: ' + author + '\n' +
                        'Дата: ' + date.split('-').reverse().join('.');
                    sendTelegram(msg);
                }
            }).catch(function(err) {
                document.getElementById('saveStatus').textContent = '❌ Ошибка: ' + err.message;
                document.getElementById('saveStatus').style.color = '#ea4335';
                console.error('Ошибка сохранения:', err);
            });
        }

        // ---------- РЕНДЕРИНГ ----------
        function render() {
            const day = document.getElementById('dayFilter').value;
            const subject = document.getElementById('subjectFilter').value;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            const weekEnd = new Date(today);
            weekEnd.setDate(weekEnd.getDate() + 7);

            let filtered = tasks.filter(function(task) {
                if (subject !== 'all' && task.subject !== subject) return false;
                if (day !== 'all') {
                    const taskDate = new Date(task.date + 'T00:00:00');
                    if (day === 'today' && (taskDate < today || taskDate >= tomorrow)) return false;
                    if (day === 'tomorrow' && (taskDate < tomorrow || taskDate >= new Date(tomorrow.getTime() +
                            86400000))) return false;
                    if (day === 'week' && (taskDate < today || taskDate >= weekEnd)) return false;
                }
                return true;
            });

            filtered.sort(function(a, b) {
                const da = new Date(a.date + 'T00:00:00');
                const db = new Date(b.date + 'T00:00:00');
                return da - db;
            });

            document.getElementById('taskCount').textContent = tasks.length;
            document.getElementById('footerCount').textContent = tasks.length;

            const list = document.getElementById('taskList');
            if (filtered.length === 0) {
                list.innerHTML =
                    '<div class="empty-state"><i class="fas fa-inbox"></i><p>Заданий пока нет</p></div>';
                return;
            }

            let html = '';
            filtered.forEach(function(task) {
                const taskDate = new Date(task.date + 'T00:00:00');
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                const isOverdue = !task.done && taskDate < now;
                const dateStr = task.date.split('-').reverse().join('.');
                const dayOfWeek = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][taskDate.getDay()];

                const author = task.author || 'Аноним';
                const initials = author.split(' ').map(function(s) { return s[0]; }).join('').toUpperCase().slice(0, 2);

                let attachHtml = '';
                if (task.attachment && task.attachment.trim() !== '') {
                    const url = task.attachment.trim();
                    if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(url)) {
                        attachHtml =
                            '<div class="task-attachment"><img src="' + url + '" alt="фото" loading="lazy"></div>';
                    } else {
                        attachHtml = '<div class="task-attachment"><i class="fas fa-paperclip"></i> <a href="' + url +
                            '" target="_blank">Ссылка</a></div>';
                    }
                }

                const likes = task.likes || [];
                const userLiked = likes.indexOf(currentUser) !== -1;
                const likeCount = likes.length;

                let adminButtons = '';
                if (isAdmin || task.author === currentUser) {
                    adminButtons =
                        '<button class="btn btn-outline btn-sm editBtn" data-id="' + task.id +
                        '"><i class="fas fa-edit"></i></button>' +
                        '<button class="btn btn-danger btn-sm deleteBtn" data-id="' + task.id +
                        '"><i class="fas fa-trash"></i></button>';
                }

                html +=
                    '<div class="card" data-id="' + task.id + '">' +
                    '<div class="task-header">' +
                    '<span class="task-subject">' + task.subject + '</span>' +
                    '<span class="task-date ' + (isOverdue ? 'overdue' : '') + '">' +
                    '<i class="far fa-calendar-alt"></i> ' + dateStr + ' (' + dayOfWeek + ')' +
                    (isOverdue ? ' <i class="fas fa-exclamation-triangle"></i>' : '') +
                    '</span>' +
                    '</div>' +
                    '<div class="task-text">' + task.text + '</div>' +
                    attachHtml +
                    '<div class="task-footer">' +
                    '<div class="author-block">' +
                    '<div class="avatar">' + initials + '</div>' +
                    '<div>' +
                    '<span class="author-name">' + author + '</span>' +
                    '<span class="author-time"> · <i class="far fa-clock"></i> ' + new Date(task.timestamp || task.id)
                    .toLocaleString('ru', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) +
                    '</span>' +
                    '</div>' +
                    '</div>' +
                    '<div class="task-actions">' +
                    '<button class="like-btn ' + (userLiked ? 'liked' : '') + '" data-id="' + task.id + '">' +
                    '<i class="fas fa-heart"></i>' +
                    '<span class="like-count">' + likeCount + '</span>' +
                    '</button>' +
                    adminButtons +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });
            list.innerHTML = html;

            // Обработчики
            list.querySelectorAll('.like-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    toggleLike(id);
                });
            });
            list.querySelectorAll('.editBtn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    openEditModal(id);
                });
            });
            list.querySelectorAll('.deleteBtn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    if (confirm('Удалить задание?')) {
                        tasksRef.child(id).remove().catch(function(err) { alert('Ошибка: ' + err.message); });
                    }
                });
            });
        }

        // ---------- ЛАЙК ----------
        function toggleLike(taskId) {
            const task = tasks.find(function(t) { return t.id === taskId; });
            if (!task) return;
            const likes = task.likes || [];
            const idx = likes.indexOf(currentUser);
            if (idx === -1) {
                likes.push(currentUser);
            } else {
                likes.splice(idx, 1);
            }
            tasksRef.child(taskId).update({ likes: likes });
        }

        // ---------- МОДАЛКА ----------
        function openModal(title, data) {
            document.getElementById('modalTitle').textContent = title;
            if (data) {
                document.getElementById('formSubject').value = data.subject || '';
                document.getElementById('formText').value = data.text || '';
                document.getElementById('formDate').value = data.date || '';
                document.getElementById('formAuthor').value = data.author || '';
                document.getElementById('formAttachment').value = data.attachment || '';
                document.getElementById('editId').value = data.id || '';
                editingId = data.id || null;
            } else {
                document.getElementById('formSubject').value = '';
                document.getElementById('formText').value = '';
                document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('formAuthor').value = currentUser;
                document.getElementById('formAttachment').value = '';
                document.getElementById('editId').value = '';
                editingId = null;
            }
            document.getElementById('saveStatus').textContent = '';
            document.getElementById('taskModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            editingId = null;
        }

        function openAddModal() {
            openModal('Новое задание', null);
        }

        function openEditModal(id) {
            const task = tasks.find(function(t) { return t.id === id; });
            if (!task) return;
            if (!isAdmin && task.author !== currentUser) {
                alert('Вы можете редактировать только свои задания.');
                return;
            }
            openModal('Редактировать задание', task);
        }

        // ---------- ОБРАБОТЧИКИ ----------
        document.getElementById('addBtn').addEventListener('click', openAddModal);
        document.getElementById('cancelModal').addEventListener('click', closeModal);
        document.getElementById('taskModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ----- ГЛАВНОЕ: КНОПКА СОХРАНИТЬ -----
        document.getElementById('saveBtn').addEventListener('click', function() {
            saveTask();
        });

        // Также можно сохранять по Enter в полях (удобно)
        document.querySelectorAll('#taskForm input, #taskForm textarea').forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && this.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    saveTask();
                }
            });
        });

        // ---------- ФИЛЬТРЫ ----------
        document.getElementById('dayFilter').addEventListener('change', render);
        document.getElementById('subjectFilter').addEventListener('change', render);
        document.getElementById('resetFilters').addEventListener('click', function() {
            document.getElementById('dayFilter').value = 'all';
            document.getElementById('subjectFilter').value = 'all';
            render();
        });

        // ---------- СТАРТ ----------
        console.log('Сайт загружен, кнопка "Сохранить" привязана!');
    </script>
</body>
</html>
