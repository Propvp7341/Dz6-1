    .like-btn {

      font-size: 1.2rem;

      color: #8a9ab8;

      align-items: center;
      gap: 0.2rem;

    }
    body.dark .like-btn .like-count {

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;

    .modal-content {
      background: #fff;
      border-radius: 32px;
      max-width: 520px;
      width: 90%;
      padding: 2rem 1.8rem;
      border: 1px solid #e0e6f0;
      transform: scale(0.95);

      max-height: 90vh;
      overflow-y: auto;

    .modal-overlay.active .modal-content {
      transform: scale(1);

      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 1.2rem;

    .form-group {

      .card { padding: 1rem; }
      .modal-content { padding: 1.5rem; }
      .task-footer { flex-direction: column; align-items: stretch; gap: 0.5rem; }

  </style>
</head>
<body>
<div class="container">
  <header class="app-header">
    <h1><i class="fas fa-home"></i> 6-1 · ДЗ</h1>
    <div class="header-actions">
      <span class="stat-item" id="taskCount">0</span>
      <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Добавить</button>
      <button class="btn btn-outline btn-sm admin-btn" id="adminBtn"><i class="fas fa-lock"></i> <span id="adminLabel">Админ</span></button>
      <button class="theme-toggle" id="themeToggle" aria-label="Тема"><i class="fas fa-moon"></i></button>
    </div>
  </header>

  <div class="filter-bar">
    <label><i class="fas fa-calendar-day"></i> День
      <select id="dayFilter">
        <option value="all">Все</option>
        <option value="today">Сегодня</option>
        <option value="tomorrow">Завтра</option>
        <option value="week">Неделя</option>
      </select>
    </label>
    <label><i class="fas fa-tag"></i> Предмет
      <select id="subjectFilter">
        <option value="all">Все</option>
        <option value="Математика">Математика</option>
        <option value="Физика">Физика</option>
        <option value="Литература">Литература</option>
        <option value="Информатика">Информатика</option>
        <option value="Русский язык">Русский язык</option>
        <option value="Английский язык">Английский язык</option>
        <option value="Химия">Химия</option>
        <option value="Биология">Биология</option>
        <option value="История">История</option>
        <option value="Обществознание">Обществознание</option>
        <option value="География">География</option>
        <option value="Другое">Другое</option>
      </select>
    </label>
    <span class="filter-reset" id="resetFilters"><i class="fas fa-undo-alt"></i> Сбросить</span>
  </div>

  <div class="task-list" id="taskList"></div>

  <div class="footer">
    <i class="fas fa-database"></i> Данные в облаке · <span id="footerCount">0</span> заданий
  </div>
</div>

<!-- модалка -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <h2 id="modalTitle">Новое задание</h2>
    <form id="taskForm">
      <div class="form-group">
        <label>Предмет</label>
        <input type="text" id="formSubject" placeholder="Например, Математика" list="subjectList" required>
        <datalist id="subjectList">
          <option value="Математика"><option value="Физика"><option value="Литература">
          <option value="Информатика"><option value="Русский язык"><option value="Английский язык">
          <option value="Химия"><option value="Биология"><option value="История">
          <option value="Обществознание"><option value="География"><option value="Другое">
        </datalist>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="formText" placeholder="Что нужно сделать?" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Дата выполнения</label>
          <input type="date" id="formDate" required>
        </div>
        <div class="form-group">
          <label>Автор</label>
          <input type="text" id="formAuthor" placeholder="Ваше имя" required>
        </div>
      </div>
      <div class="form-group">
        <label>Ссылка на фото (необязательно)</label>
        <input type="text" id="formAttachment" placeholder="https://...">
      </div>
      <input type="hidden" id="editId" value="">
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="cancelModal">Отмена</button>
        <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Сохранить</button>
      </div>
    </form>
  </div>
</div>

    function loadUserName() {
      const saved = localStorage.getItem('hw6_userName');
      if (saved) {
        currentUser = saved;
      } else {
        const name = prompt('Введите ваше имя (оно будет показано как автор заданий):', '');
        if (name && name.trim()) {
          currentUser = name.trim();
          localStorage.setItem('hw6_userName', currentUser);
        } else {
          currentUser = 'Аноним';
        }
      }
      formAuthor.value = currentUser;
    }

    // ---------- АДМИН ----------
    function toggleAdmin() {
      if (isAdmin) {
        isAdmin = false;
        sessionStorage.removeItem('hw6_admin');
        updateAdminUI();
        render();
        return;
      }
      const pass = prompt('Введите пароль админа:');
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        sessionStorage.setItem('hw6_admin', 'true');
        updateAdminUI();
        render();
      } else if (pass !== null) {
        alert('Неверный пароль!');
      }
    }

    function updateAdminUI() {
      if (isAdmin) {
        adminBtn.classList.add('active');
        adminLabel.textContent = 'Админ (вкл)';
      } else {
        adminBtn.classList.remove('active');
        adminLabel.textContent = 'Админ';
      }
    }

    // ---------- ТЕМА ----------
    function loadTheme() {
      const dark = localStorage.getItem('hw6_theme') === 'dark';
      document.body.classList.toggle('dark', dark);
      themeToggle.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    function toggleTheme() {
      const dark = document.body.classList.toggle('dark');
      localStorage.setItem('hw6_theme', dark ? 'dark' : 'light');
      themeToggle.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    themeToggle.addEventListener('click', toggleTheme);

    // ---------- ЗАГРУЗКА ЗАДАНИЙ ИЗ FIREBASE ----------
    function loadTasks() {
      tasksRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          tasks = Object.entries(data).map(([key, value]) => {
            return { id: key, ...value };
          });
        } else {
          tasks = [];
        }
        render();
      }, (error) => {
        console.error('Ошибка загрузки:', error);
        alert('Не удалось загрузить данные из Firebase. Проверьте конфиг и правила базы.');
      });
    }

    // ---------- CRUD ----------
    function addTask(task) {
      return tasksRef.push().set(task);
    }
    function updateTask(id, updated) {
      return tasksRef.child(id).update(updated);
    }
    function deleteTask(id) {
      return tasksRef.child(id).remove();
    }

    // ---------- ОТПРАВКА В TELEGRAM ----------
    function sendTelegram(message) {
      const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
      const payload = {
        chat_id: CHAT_ID,
        text: message,
        parse_mode: 'HTML'
      };
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.warn('Telegram error:', err));
    }

    // ---------- РЕНДЕРИНГ ----------
    function render() {
      // ... (код рендеринга без изменений, см. предыдущую версию) ...
      // Я приведу полный код в финальном ответе, здесь сокращаю для экономии места
    }

    // ... (остальные функции такие же, как в прошлой версии) ...

    // ИНИЦИАЛИЗАЦИЯ
    loadUserName();
    loadTheme();
    loadTasks();
    formAuthor.value = currentUser;
    const adminSession = sessionStorage.getItem('hw6_admin');
    if (adminSession === 'true') {
      isAdmin = true;
      updateAdminUI();
    }
    updateAdminUI();

  })();
</script>
